# One workspace, five Rust parts: the three shared packages (protocol, crypto,
# store), the server, and the Tauri shell. The shared packages live in packages/
# on purpose — app and server need the same version, or they drift apart. External
# dependencies are centralized in [workspace.dependencies] so prost, the crypto
# crates, etc. run at the same version everywhere.
[workspace]
resolver = "2"
members = [
    "packages/openom-protocol",
    "packages/openom-crypto",
    "packages/openom-roles",
    "packages/openom-keyring",
    "packages/keyeo-api",
    "packages/openom-model",
    "packages/openom-jcs",
    "packages/openom-did",
    "packages/edsign",
    "packages/openom-edtf",
    "packages/openom-claim",
    "packages/openom-projection",
    "packages/openom-crdt",
    "packages/openom-tree",
    "packages/openom-sealer",
    "packages/openom-vault",
    "packages/openom-vault-host",
    "packages/journal",
    "packages/openom-sync",
    "packages/keyeo",
    "packages/keyeo-dag",
    "packages/docsync",
    "packages/blobstore",
    "openom",
    "apps/src-tauri",
]

[workspace.package]
version = "0.1.0"
license = "AGPL-3.0-or-later"
edition = "2021"
# The only supported build path is the container (see scripts/cargo.mjs), currently
# rustc 1.97. 1.85 as an honest floor lets the MSRV-aware resolver pick the newest
# dependencies rather than downgrading them.
rust-version = "1.85"

[workspace.lints.rust]
# The kani proof harnesses are gated on `#[cfg(kani)]` — a cfg the kani driver sets, not cargo — so a
# normal build would warn "unexpected cfg". Declare it known (still checking every other cfg name). Crates
# with harnesses opt in via `[lints] workspace = true`. See scripts/kani.mjs and docker/kani.Dockerfile.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.dependencies]
# Internal crates (path relative to this root manifest).
openom-protocol = { path = "packages/openom-protocol" }
openom-crypto = { path = "packages/openom-crypto" }
openom-roles = { path = "packages/openom-roles" }
openom-keyring = { path = "packages/openom-keyring" }
keyeo-dag = { path = "packages/keyeo-dag" }
keyeo-api = { path = "packages/keyeo-api" }
openom-jcs = { path = "packages/openom-jcs" }
openom-did = { path = "packages/openom-did" }
edsign = { path = "packages/edsign" }
openom-edtf = { path = "packages/openom-edtf" }
openom-claim = { path = "packages/openom-claim" }
openom-projection = { path = "packages/openom-projection" }
openom-crdt = { path = "packages/openom-crdt" }
openom-tree = { path = "packages/openom-tree" }
journal = { path = "packages/journal" }
blobstore = { path = "packages/blobstore" }
# Vendored generic DAG group-membership crate (kept publishable, no openom deps). openom wires its own
# roles/signing/keys onto keyeo's seams in keyeo-dag; keyeo itself never gains an openom dep.
keyeo = { path = "packages/keyeo" }

# Protocol / serialization.
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# JSON Schema (Draft 2020-12) validation of the canonical model — native/test only. default-features
# off drops the reqwest-based remote-$ref resolver (no network); our schemas use only internal $refs.
jsonschema = { version = "0.28", default-features = false }

# Server: Axum on AWS Lambda (Monolith-on-FaaS).
axum = "0.8"
lambda_http = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Observability export: the `tracing` macros stay the only instrumentation API;
# these turn spans into OTLP (HTTP/protobuf over reqwest+rustls — no gRPC/tonic, no
# OpenSSL) for grafana/otel-lgtm locally and Better Stack in prod. Only active when
# OPENOM_OTEL is set; otherwise the server just logs to stdout.
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "http-proto", "reqwest-client", "reqwest-rustls"] }
tracing-opentelemetry = "0.33"
# HTTP request tracing (per-request root span with safe fields only).
tower-http = { version = "0.6", features = ["trace"] }
# Metadata DB: Neon (serverless Postgres) in prod, a local container in dev.
# ring, not aws-lc-rs, to avoid a cmake/C build in the container.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "migrate", "macros"] }

# Auth: Supabase JWTs validated in-memory (HS256); uuid for account/tree ids.
# Pure-Rust HMAC backend, not the aws-lc-rs default — HS256 needs no process-level
# rustls CryptoProvider (which the default would panic without at first decode), and
# it avoids a cmake/C build in the container.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Crypto: the same primitives on client and server.
aes-gcm = "0.11"
chacha20poly1305 = "0.11"
argon2 = "0.5"
# Ed25519 is deliberately NOT a workspace dependency: the raw ed25519-dalek edge lives only in
# edsign (by explicit version there), so the verify_strict-only seam can't be bypassed by a
# crate drawing its own `ed25519-dalek.workspace = true` (OPE-215).
# Best-effort scrub of key material (KEK/DEK buffers) on drop.
zeroize = { version = "1", features = ["derive"] }
# CSPRNG for DEKs / salts / nonces. On wasm32 this needs the `wasm_js` backend cfg
# (set at the web-build step) — a native build uses the OS RNG directly.
getrandom = "0.3"
# Base32 for the printable recovery code (grouped, checksummed).
data-encoding = "2"
# HKDF-SHA256: expands the one Argon2id output into three independent keys (the KEK that
# wraps the DEK, the Ed25519 owner identity that signs the keyring, and the X25519 HPKE
# key that receives a shared DEK wrap). See derive_root.
hkdf = "0.12"
# RFC 9180 HPKE — wraps the tree DEK to a member's X25519 public key when sharing
# (WRAP_METHOD_X25519_HPKE). Suite: DHKEM(X25519, HKDF-SHA256) + HKDF-SHA256 +
# ChaCha20Poly1305. Only the X25519 KEM is enabled (no P-256), to keep the dep and the
# wasm bundle small.
hpke = { version = "0.12", default-features = false, features = ["x25519", "alloc"] }
# rand_core traits so HPKE's seal can draw its ephemeral key from a getrandom-backed
# CSPRNG (same OS/browser entropy the rest of the crate uses). 0.6 unifies with the
# version hpke and ed25519-dalek already pull in.
rand_core = "0.6"

# Store client (arrives with the upload path): compress + upload. rustls instead
# of native-tls, so no OpenSSL is needed in the container. The exact rustls
# provider (aws-lc-rs vs. ring) is decided once the client exists and a real HTTPS
# call can be tested — here only predefined.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
zstd = "0.13"

# S3 request signing only (no runtime, no OpenSSL): rusty-s3 builds + signs
# requests and presigned URLs; reqwest (above, rustls) sends the bytes. This pair
# talks to MinIO (dev) and Cloudflare R2 (prod) identically. Presigning is the
# media path's core need, which is exactly rusty-s3's competency.
rusty-s3 = "0.8"
sha2 = "0.10"
url = "2"
base64 = "0.22"

# Errors / SQLite (only the store uses rusqlite).
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }

# Property-based testing (dev-only) for the frozen crypto + wire format. Stable-toolchain
# friendly, unlike cargo-fuzz; the "never panics on arbitrary bytes" properties give
# fuzz-style coverage of the decode/open paths without a nightly libFuzzer setup.
proptest = "1"

# The wasm build profile (sealer + tree). MUST live in this ROOT manifest — Cargo
# ignores `[profile.*]` in member manifests. `scripts/build-{sealer,tree}.mjs` build
# with `--profile wasm-release`. Tuned for STARTUP, not smallest module: opt-level=3, so
# the compute on the critical path (Argon2id unlock, seal/open, CRDT snapshot decode)
# runs fast — the same trade the chatletting/libzaungast browser demos landed on, where
# execution-during-init dominated startup over the extra download/compile of a bigger
# module. Fat LTO + one codegen unit inline across the crate boundaries, abort-on-panic
# (no unwinding tables in wasm), strip (wasm-bindgen + wasm-opt trim the rest). Revisit
# size vs. startup with a real measurement (see the deferred profiling task) before
# trading opt-level=3 back down to "s"/"z".
[profile.wasm-release]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
