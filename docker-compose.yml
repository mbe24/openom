# Local dev stack for the openom server (RUN_MODE=local). Everything is decoupled
# from the cloud: MinIO stands in for Cloudflare R2, a Postgres container for Neon.
# The server rebuilds and restarts on source changes via cargo-watch.
#
#   docker compose up --build     # server (:6060), Postgres (:5432), MinIO (:9000, console :9001)
#   docker compose down           # stop
#   docker compose down -v        # stop and wipe the data + build-cache volumes
#
# First `up` compiles the server (a few minutes); after that the target volume
# caches it, so restarts are fast. Health: http://localhost:6060/health and
# http://localhost:6060/ready (the latter pings Postgres).
services:
  server:
    build:
      context: .
      dockerfile: openom/Dockerfile
    image: openom-server-dev:latest
    # --poll: file-change events don't cross the Windows→container bind mount
    # reliably, so poll instead of relying on inotify.
    command: ["cargo", "watch", "--poll", "-x", "run -p openom"]
    working_dir: /work
    environment:
      RUN_MODE: local
      OPENOM_HTTP_ADDR: 0.0.0.0:${OPENOM_HTTP_PORT:-6060}
      DATABASE_URL: postgres://openom:openom@postgres:5432/openom
      S3_ENDPOINT: http://minio:9000
      # Presigned URLs handed to clients must be reachable from the host/browser, not
      # the in-cluster minio hostname (the SigV4 signature binds the host).
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_BUCKET: openom-trees
      S3_REGION: us-east-1
      S3_ACCESS_KEY: openom
      S3_SECRET_KEY: openompw123
      CARGO_TARGET_DIR: /tmp/target
      RUST_LOG: info,openom=debug
      # Observability (opt-in). The exporter only runs when OPENOM_OTEL=1 *and* the
      # `lgtm` service is up (COMPOSE_PROFILES=observability); otherwise the server
      # just logs to stdout. Endpoint targets the bundled collector's OTLP/HTTP port.
      OPENOM_OTEL: "${OPENOM_OTEL:-0}"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    ports:
      # Host port from .env (OPENOM_HTTP_PORT); default 6060.
      - "${OPENOM_HTTP_PORT:-6060}:${OPENOM_HTTP_PORT:-6060}"
    volumes:
      - type: bind
        source: .
        target: /work
      - openom-server-cargo:/usr/local/cargo/registry
      - openom-server-target:/tmp/target
    depends_on:
      postgres:
        condition: service_healthy   # migrations run at startup — wait for the DB
      minio:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: openom
      POSTGRES_PASSWORD: openom
      POSTGRES_DB: openom
    ports:
      - "5432:5432"
    volumes:
      - openom-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openom -d openom"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: openom
      MINIO_ROOT_PASSWORD: openompw123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - openom-minio:/data

  # Local observability, opt-in to spare the machine. grafana/otel-lgtm is an
  # all-in-one image: one OTLP endpoint (4317 gRPC / 4318 HTTP) feeding Grafana +
  # Loki (logs) + Tempo (traces) + Prometheus/Mimir (metrics). It does NOT start by
  # default — enable it by setting COMPOSE_PROFILES=observability in .env (and
  # OPENOM_OTEL=1 so the server actually exports). Data is ephemeral by design.
  lgtm:
    image: grafana/otel-lgtm:latest
    profiles: ["observability"]
    ports:
      - "${OPENOM_GRAFANA_PORT:-3000}:3000"   # Grafana UI
      - "4317:4317"                           # OTLP gRPC
      - "4318:4318"                           # OTLP HTTP

volumes:
  openom-server-cargo:
  openom-server-target:
  openom-postgres:
  openom-minio:
