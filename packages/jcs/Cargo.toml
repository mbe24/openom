# RFC 8785 (JSON Canonicalization Scheme) — the deterministic byte-encoding beneath every
# content-hash id, dedup fingerprint, and content reference in the claim model. Pure and
# wasm-dual: native and wasm MUST emit identical bytes (the read-model projection's dedup and
# refutation memory fork silently on any divergence — see design.substrate-adaptation §7).
[package]
name = "jcs"
description = "RFC 8785 JSON Canonicalization Scheme: deterministic canonical bytes (UTF-16 key order, minimal escaping, integers-only, hard float rejection) plus field-selective canonicalization for content-hash ids and fingerprints."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true

[dev-dependencies]
proptest.workspace = true
