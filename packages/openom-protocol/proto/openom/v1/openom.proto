syntax = "proto3";

package openom.v1;

// One sealed unit in the append-only log: a full snapshot or an incremental delta.
// The server treats `ciphertext` as opaque; everything it routes on lives in
// `header`, which is authenticated as AEAD associated data (AAD). The three-field
// skeleton (version, header, ciphertext) is frozen forever.
message Envelope {
  // Wire-format selector. Read first (untrusted) to choose the layout, then
  // verified because it is covered by the AAD. An older client that sees a newer
  // version opens read-only rather than misreading.
  uint32 version = 1;
  // All metadata. Authenticated as AAD so the server cannot tamper with it.
  Header header = 2;
  // AEAD( compress(payload) ) — the sealed body. Opaque to the server.
  bytes ciphertext = 3;
}

// All envelope metadata. Plaintext to the server, but bound to the ciphertext via
// AAD. Deliberately algorithm-agnostic: no CRDT causality and no client wall-clock
// live here (both are inside the ciphertext).
message Header {
  // Full state (KIND_SNAPSHOT) or incremental change (KIND_DELTA).
  Kind kind = 1;
  // How the decrypted payload is encoded. Open set; the server stays blind to it.
  Format format = 2;

  // AEAD construction that sealed the ciphertext.
  Aead aead = 3;
  // Whether the payload was compressed before encryption.
  Compression compression = 4;
  // Which DEK/epoch sealed this (matches KeyEpoch.key_id). Opaque.
  bytes key_id = 5;
  // AEAD nonce. Public.
  bytes nonce = 6;

  // Opaque tree id (UUID); never a human-readable name.
  bytes tree_id = 7;
  // Producing replica: >=128-bit CSPRNG, per-(tree, replica context), with no
  // machine-stable substring. With replica_counter it forms the idempotency dot.
  bytes replica_id = 8;
  // This replica's monotonic operation counter, from 0.
  uint64 replica_counter = 9;
  // SHA-256 of `ciphertext`; the keyless server verifies it on upload.
  bytes ciphertext_hash = 10;
  // Previous entry's ciphertext_hash from the same replica — a per-replica chain
  // giving fork/omission evidence. Empty on a replica's first entry.
  bytes prev_ciphertext_hash = 11;

  // SNAPSHOT only: the highest server seq this snapshot folds in. 0 = empty log.
  uint64 covers_through_seq = 12;
  // SNAPSHOT only; reserved, empty in V1. Links a snapshot to the one it replaced
  // (rollback evidence for the snapshot line).
  bytes replaces_ciphertext_hash = 13;

  // Per-member signature for change attribution on shared trees; absent means "not
  // attributed" (V1's communal-DEK trust model). Ed25519 over `author_signing_bytes`
  // (domain-tagged, excludes nonce/ciphertext_hash/itself, binds SHA-256(plaintext)).
  // Stays inside header_aad: stripping it invalidates the AEAD tag (fail-closed).
  bytes author_signature = 14;

  // The member who authored this entry, on a shared tree (matches a Keyring.members
  // entry). Names whose key verifies author_signature. Empty on unattributed trees.
  string author_member_id = 16;
  // Opaque, ENGINE-PRODUCED reference to the keyring state that GOVERNED this entry when
  // authored — the verifier resolves it (via the engine adapter) to the governing keyring to
  // look up the author's role. Chain encodes (revision, keyring_hash); dag encodes
  // (era, history_commitment). Signed (in author_signing_bytes) so it can't be tampered;
  // empty on unattributed trees. Distinct from the client's keyring watermark (a sync-layer
  // anti-rollback cursor, engine-owned, NOT in the header). (§B3; OPE-277 GoverningRef.)
  bytes governing_ref = 17;

  // KIND_MEDIA only: the blob's random remote id, bound into the AAD so the server
  // cannot swap two of a tree's blobs undetected (the AAD otherwise binds only
  // tree_id). Empty for tree kinds and throughout V1. Reader-side ciphertext-hash
  // verification remains the primary media-integrity check; this is defense in depth.
  bytes blob_id = 15;
}

// What the object is. SNAPSHOT/DELTA are append-log entries of a tree; MEDIA is a
// single standalone media blob (referenced by the encrypted tree doc, not part of
// the log). PROPOSAL is a staged bundle of edits awaiting approval — it lives in a
// separate proposals channel and MUST be refused on the append/log path, so a
// malicious server can't replay an editor's proposal into the tree. MEDIA and
// PROPOSAL leave the tree-coordination fields above empty.
enum Kind {
  KIND_UNSPECIFIED = 0;
  KIND_SNAPSHOT = 1;
  KIND_DELTA = 2;
  KIND_MEDIA = 3;
  KIND_PROPOSAL = 4;
}

// Encoding of the decrypted payload.
enum Format {
  FORMAT_UNSPECIFIED = 0;
  // V1: the full tree as openom JSON (snapshot only).
  FORMAT_OPENOM_JSON = 1;
  // A claim-model op batch (JSON) — the delta and snapshot payload the claim engine seals.
  FORMAT_OPENOM_OPS = 2;
  // Tag 3 was YRS_UPDATE; a concrete CRDT format value is added when deltas ship.
  reserved 3;
  // Opaque bytes — a media blob (image, etc.). The server never interprets it.
  FORMAT_RAW_BYTES = 4;
}

// AEAD construction.
enum Aead {
  AEAD_UNSPECIFIED = 0;
  AEAD_AES_256_GCM = 1;
  AEAD_XCHACHA20_POLY1305 = 2;
}

// Payload compression.
enum Compression {
  COMPRESSION_UNSPECIFIED = 0;
  COMPRESSION_NONE = 1;
  COMPRESSION_ZSTD = 2;
}

// The managed keyring-endpoint transport envelope: the ONE message the server parses for
// `PUT /trees/{id}/keyring`. It carries only ROUTING metadata the server uses WITHOUT understanding any
// keyring implementation, plus an opaque `payload`. The server dispatches on `engine` to a KeyringVerifier,
// keys storage on the VERIFIED `Admitted.update_ref` (never the hints below), and never decodes `payload`.
// Sequencer-free engines (the dag) sync via content-addressed blobs and never use this endpoint.
message KeyringUpdate {
  // Wire-layout selector; a reader refuses a version it doesn't understand rather than misparsing.
  uint32 version = 1;
  // Routing HINT (equals the URL path). The authoritative value is `Admitted.tree_id`, read from the
  // verified body — the server equality-checks this against it.
  bytes tree_id = 2;
  // Routing HINT: which engine's verifier to dispatch to ("chain" / …). Cross-checked against the tree's
  // pinned engine; never trusted alone.
  string engine = 3;
  // Position HINT (chain: the revision's governing-ref). A fast-fail equality check only — the server keys
  // storage / CAS / head-advance on the VERIFIED `Admitted.update_ref`, never on this.
  bytes update_ref = 4;
  // The opaque membership update — an openom-keyring-api `MembershipEnvelope` wrapping the engine's signed body
  // (chain: a Keyring). The server never decodes it; it hands it to the dispatched verifier's `admit`.
  bytes payload = 5;
  // 6..15 reserved for engine-neutral transport additions — any future field a server acts on must arrive
  // NAMED and paired with a verified twin in `Admitted`, never as an anonymous opaque slot.
  reserved 6 to 15;
}

// A member's access/approval role. OWNER is the founder (billing payer). CO_OWNER is
// also an authorized signer; ADMIN approves edits but does NOT sign the keyring;
// EDITOR proposes (needs approval); VIEWER is read-only. (The keyring wire itself —
// Keyring/Member/KeyEpoch/KeyWrap/RecoveryKey/KeyringSignature — moved to
// openom-keyring-chain in OPE-300; this enum stays because the sealer/vault path reads role values.)
enum MemberRole {
  MEMBER_ROLE_UNSPECIFIED = 0;
  MEMBER_ROLE_OWNER = 1;
  MEMBER_ROLE_CO_OWNER = 2;
  MEMBER_ROLE_ADMIN = 3;
  MEMBER_ROLE_EDITOR = 4;
  MEMBER_ROLE_VIEWER = 5;
}

// Argon2id parameters (explicit so cost can rise later). Kept here (unlike the rest of the keyring wire,
// which moved to openom-keyring-chain in OPE-300) because the sealer/crypto path — openom-crypto's
// recovery/wrap KDFs — reads and writes it. openom-keyring-chain carries its OWN wire-identical copy.
message KdfParams {
  // Random per-member salt.
  bytes salt = 1;
  // Memory cost, KiB.
  uint32 memory_kib = 2;
  // Time cost (passes).
  uint32 iterations = 3;
  // Parallelism (lanes).
  uint32 parallelism = 4;
}

// How a DEK is wrapped for a member. (Value-compatible with openom-keyring-chain's wrap-method constants;
// kept here because openom-crypto reads it on the sealer path.)
enum WrapMethod {
  WRAP_METHOD_UNSPECIFIED = 0;
  WRAP_METHOD_PASSPHRASE_ARGON2ID = 1;
  WRAP_METHOD_X25519_HPKE = 2;
  // A second wrap of the same DEK under a high-entropy printable recovery code, so a
  // lost passphrase isn't total data loss. A distinct value (not reusing PASSPHRASE)
  // makes the two wraps for one member unambiguous — wrap_method is in the wrap's AAD
  // tuple (§4), so they can't be swapped. Additive/non-breaking (open enum).
  WRAP_METHOD_RECOVERY_CODE_ARGON2ID = 3;
  // An epoch's DEK sealed (HPKE) to a RecoveryKey's public key, so the founder reaches
  // every epoch via one recovery root private key. Uses the per-epoch wrap binding.
  WRAP_METHOD_RRK_HPKE = 4;
}
