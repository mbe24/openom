syntax = "proto3";

package openom.v1;

// One sealed unit in the append-only log: a full snapshot or an incremental delta.
// The server treats `ciphertext` as opaque; everything it routes on lives in
// `header`, which is authenticated as AEAD associated data (AAD). The three-field
// skeleton (version, header, ciphertext) is frozen forever.
message Envelope {
  // Wire-format selector. Read first (untrusted) to choose the layout, then
  // verified because it is covered by the AAD. An older client that sees a newer
  // version opens read-only rather than misreading.
  uint32 version = 1;
  // All metadata. Authenticated as AAD so the server cannot tamper with it.
  Header header = 2;
  // AEAD( compress(payload) ) — the sealed body. Opaque to the server.
  bytes ciphertext = 3;
}

// All envelope metadata. Plaintext to the server, but bound to the ciphertext via
// AAD. Deliberately algorithm-agnostic: no CRDT causality and no client wall-clock
// live here (both are inside the ciphertext).
message Header {
  // Full state (KIND_SNAPSHOT) or incremental change (KIND_DELTA).
  Kind kind = 1;
  // How the decrypted payload is encoded. Open set; the server stays blind to it.
  Format format = 2;

  // AEAD construction that sealed the ciphertext.
  Aead aead = 3;
  // Whether the payload was compressed before encryption.
  Compression compression = 4;
  // Which DEK/epoch sealed this (matches KeyEpoch.key_id). Opaque.
  bytes key_id = 5;
  // AEAD nonce. Public.
  bytes nonce = 6;

  // Opaque tree id (UUID); never a human-readable name.
  bytes tree_id = 7;
  // Producing replica: >=128-bit CSPRNG, per-(tree, replica context), with no
  // machine-stable substring. With replica_counter it forms the idempotency dot.
  bytes replica_id = 8;
  // This replica's monotonic operation counter, from 0.
  uint64 replica_counter = 9;
  // SHA-256 of `ciphertext`; the keyless server verifies it on upload.
  bytes ciphertext_hash = 10;
  // Previous entry's ciphertext_hash from the same replica — a per-replica chain
  // giving fork/omission evidence. Empty on a replica's first entry.
  bytes prev_ciphertext_hash = 11;

  // SNAPSHOT only: the highest server seq this snapshot folds in. 0 = empty log.
  uint64 covers_through_seq = 12;
  // SNAPSHOT only; reserved, empty in V1. Links a snapshot to the one it replaced
  // (rollback evidence for the snapshot line).
  bytes replaces_ciphertext_hash = 13;

  // Per-member signature for change attribution on shared trees; absent means "not
  // attributed" (V1's communal-DEK trust model). Ed25519 over `author_signing_bytes`
  // (domain-tagged, excludes nonce/ciphertext_hash/itself, binds SHA-256(plaintext)).
  // Stays inside header_aad: stripping it invalidates the AEAD tag (fail-closed).
  bytes author_signature = 14;

  // The member who authored this entry, on a shared tree (matches a Keyring.members
  // entry). Names whose key verifies author_signature. Empty on unattributed trees.
  string author_member_id = 16;
  // Opaque, ENGINE-PRODUCED reference to the keyring state that GOVERNED this entry when
  // authored — the verifier resolves it (via the engine adapter) to the governing keyring to
  // look up the author's role. Chain encodes (revision, keyring_hash); dag encodes
  // (era, history_commitment). Signed (in author_signing_bytes) so it can't be tampered;
  // empty on unattributed trees. Distinct from the client's keyring watermark (a sync-layer
  // anti-rollback cursor, engine-owned, NOT in the header). (§B3; OPE-277 GoverningRef.)
  bytes governing_ref = 17;

  // KIND_MEDIA only: the blob's random remote id, bound into the AAD so the server
  // cannot swap two of a tree's blobs undetected (the AAD otherwise binds only
  // tree_id). Empty for tree kinds and throughout V1. Reader-side ciphertext-hash
  // verification remains the primary media-integrity check; this is defense in depth.
  bytes blob_id = 15;
}

// What the object is. SNAPSHOT/DELTA are append-log entries of a tree; MEDIA is a
// single standalone media blob (referenced by the encrypted tree doc, not part of
// the log). PROPOSAL is a staged bundle of edits awaiting approval — it lives in a
// separate proposals channel and MUST be refused on the append/log path, so a
// malicious server can't replay an editor's proposal into the tree. MEDIA and
// PROPOSAL leave the tree-coordination fields above empty.
enum Kind {
  KIND_UNSPECIFIED = 0;
  KIND_SNAPSHOT = 1;
  KIND_DELTA = 2;
  KIND_MEDIA = 3;
  KIND_PROPOSAL = 4;
}

// Encoding of the decrypted payload.
enum Format {
  FORMAT_UNSPECIFIED = 0;
  // V1: the full tree as openom JSON (snapshot only).
  FORMAT_OPENOM_JSON = 1;
  // A claim-model op batch (JSON) — the delta and snapshot payload the claim engine seals.
  FORMAT_OPENOM_OPS = 2;
  // Tag 3 was YRS_UPDATE; a concrete CRDT format value is added when deltas ship.
  reserved 3;
  // Opaque bytes — a media blob (image, etc.). The server never interprets it.
  FORMAT_RAW_BYTES = 4;
}

// AEAD construction.
enum Aead {
  AEAD_UNSPECIFIED = 0;
  AEAD_AES_256_GCM = 1;
  AEAD_XCHACHA20_POLY1305 = 2;
}

// Payload compression.
enum Compression {
  COMPRESSION_UNSPECIFIED = 0;
  COMPRESSION_NONE = 1;
  COMPRESSION_ZSTD = 2;
}

// Per-tree key material AND governance: the DEK wrapped for each member across
// epochs, the authorized-signer set, and the signed membership/role list — one
// signed, anti-rollback, hash-chained document. Signed by ANY authorized signer
// (1-of-N in V1); changing the signer set itself needs the founder (or, founder
// gone, all remaining signers) — a client-enforced policy, not a wire distinction.
// Keyring-local: the Envelope/Header skeleton and AAD are untouched by this shape.
message Keyring {
  // Opaque tree id.
  bytes tree_id = 1;
  // Key generations (rotation produces a new epoch).
  repeated KeyEpoch epochs = 2;
  // Monotonic anti-rollback counter, bumped on every revision. A client refuses a
  // revision lower than the highest it has seen and (with prev_keyring_hash) one
  // that doesn't chain onto the revision it last accepted.
  uint32 revision = 3;
  // Retired single-signer fields (were signer_key_id and signature). The signer set
  // and per-signature key hints now live in authorized_signers / signatures.
  reserved 4, 5;
  // Keyring layout selector (analogous to Envelope.version): read first, then covered
  // by the signed bytes. A higher value than the client understands is opened
  // read-only rather than misread.
  uint32 layout_version = 6;
  // SHA-256 of the previous revision's canonical signing bytes; empty at genesis
  // (revision 1). Chains the revision history so a server fork of history is
  // detectable evidence rather than two indistinguishable valid states.
  bytes prev_keyring_hash = 7;
  // The trust set: who may author keyring revisions. Exactly one SIGNER_ROLE_FOUNDER.
  repeated AuthorizedSigner authorized_signers = 8;
  // The signed membership/role manifest — the authority for author_signature
  // verification and role-gated approval, so neither rests on a server-rewritable row.
  repeated Member members = 9;
  // One or more Ed25519 signatures over this keyring's canonical signing bytes, each
  // from a currently-authorized signer (any-of / 1-of-N in V1). Excluded from the
  // signed bytes, so signatures are independently collectible (threshold-ready).
  repeated KeyringSignature signatures = 10;
  // The founder-only recovery root key(s). Every epoch's DEK is HPKE-wrapped to a
  // RecoveryKey's public key (a WRAP_METHOD_RRK_HPKE wrap in the epoch), so the founder
  // reaches every epoch — past and future, including epochs a co-owner minted — by
  // unwrapping ONE recovery-key private key (held only under the founder's passphrase and
  // recovery code, never shared with members). V1: exactly one, the founder's.
  repeated RecoveryKey recovery_keys = 11;
  // Governance: the quorum to change the authorized-signer set (and to change this rule itself).
  // governance_kind: 0 = founder-or-unanimity (default), 1 = founder-only, 2 = founder-or-threshold,
  // 3 = threshold. governance_threshold is the m for the threshold kinds. Part of the signed bytes
  // (tamper-evident) and enforced from the PRIOR revision (anti-downgrade).
  uint32 governance_kind = 12;
  uint32 governance_threshold = 13;
}

// The managed keyring-endpoint transport envelope: the ONE message the server parses for
// `PUT /trees/{id}/keyring`. It carries only ROUTING metadata the server uses WITHOUT understanding any
// keyring implementation, plus an opaque `payload`. The server dispatches on `engine` to a KeyringVerifier,
// keys storage on the VERIFIED `Admitted.update_ref` (never the hints below), and never decodes `payload`.
// Sequencer-free engines (the dag) sync via content-addressed blobs and never use this endpoint.
message KeyringUpdate {
  // Wire-layout selector; a reader refuses a version it doesn't understand rather than misparsing.
  uint32 version = 1;
  // Routing HINT (equals the URL path). The authoritative value is `Admitted.tree_id`, read from the
  // verified body — the server equality-checks this against it.
  bytes tree_id = 2;
  // Routing HINT: which engine's verifier to dispatch to ("chain" / …). Cross-checked against the tree's
  // pinned engine; never trusted alone.
  string engine = 3;
  // Position HINT (chain: the revision's governing-ref). A fast-fail equality check only — the server keys
  // storage / CAS / head-advance on the VERIFIED `Admitted.update_ref`, never on this.
  bytes update_ref = 4;
  // The opaque membership update — a keyeo-api `MembershipEnvelope` wrapping the engine's signed body
  // (chain: a Keyring). The server never decodes it; it hands it to the dispatched verifier's `admit`.
  bytes payload = 5;
  // 6..15 reserved for engine-neutral transport additions — any future field a server acts on must arrive
  // NAMED and paired with a verified twin in `Admitted`, never as an anonymous opaque slot.
  reserved 6 to 15;
}

// The founder's cross-epoch recovery root key (an X25519 keypair). Owner-only by
// construction: the private key exists only under the two founder-credential wraps in
// `wraps`; every other party (co-owner rotations included) touches only `public_key`. A
// removed member never receives it, so it does not weaken revocation.
message RecoveryKey {
  // X25519 public key. Every KeyEpoch carries one WRAP_METHOD_RRK_HPKE wrap of its DEK to
  // this key. Covered by the keyring signature, so the server can't substitute it.
  bytes public_key = 1;
  // The founder this recovery key belongs to (must equal the FOUNDER signer's member_id;
  // client-verified).
  string member_id = 2;
  // The recovery root private key, wrapped under the founder's passphrase KEK
  // (WRAP_METHOD_PASSPHRASE_ARGON2ID) and recovery-code KEK
  // (WRAP_METHOD_RECOVERY_CODE_ARGON2ID) — exactly two entries in V1, each with its
  // Argon2id kdf_params. AAD is the tree-scoped rrk binding, not the per-epoch tuple.
  repeated KeyWrap wraps = 3;
  // The Recovery Verification Key: an Ed25519 public key HKDF-derived from the recovery-root
  // secret (openom_crypto::derive_rvk, domain-separated from public_key's ECDH use). Covered by
  // the keyring signature, so the untrusted server can't substitute it. A reset/recovery keyring
  // must carry the SAME recovery_verifying_key as the prior keyring (continuity) and be signed by
  // it (authorization) — this is what makes a chain reset cryptographically verifiable rather than
  // OOB-trusted. Empty on pre-RVK keyrings (then verify_reset falls back to the OOB self-check).
  bytes recovery_verifying_key = 4;
}

// A member of the authorized-signer set — a founder or co-owner who may administer
// the keyring (rotate keys, add/remove members, re-sign).
message AuthorizedSigner {
  // Ed25519 verifying key.
  bytes public_key = 1;
  // Account binding (matches a Member and the KeyWrap member_id).
  string member_id = 2;
  // Exactly one FOUNDER at all times; the rest are CO_OWNER.
  SignerRole role = 3;
}

// The signed role + key manifest for one member (everyone with access, signer or
// not). Roles and per-member keys live here so they are covered by the signature and
// cannot be rewritten by the (partly untrusted) server.
message Member {
  // Account id (matches KeyWrap.member_id).
  string member_id = 1;
  // Access/approval role.
  MemberRole role = 2;
  // Ed25519 key that produces this member's Header.author_signature. Empty until the
  // member enrolls one; pinned here so verifiers never fetch author keys from the server.
  bytes author_public_key = 3;
  // The member's X25519 HPKE public key, recorded by the signer who verified it
  // out-of-band at invite (§4a). Rotations wrap the DEK to THIS key.
  bytes hpke_public_key = 4;
}

// One signature over the keyring's canonical signing bytes.
message KeyringSignature {
  // Which authorized_signers[] entry produced this — a hint only; verification is
  // always against the client's pinned/trusted set, never this claim.
  bytes signer_public_key = 1;
  // Ed25519 signature over the keyring's canonical signing bytes.
  bytes signature = 2;
}

// Keyring administrative authority. Exactly one FOUNDER per keyring.
enum SignerRole {
  SIGNER_ROLE_UNSPECIFIED = 0;
  SIGNER_ROLE_FOUNDER = 1;
  SIGNER_ROLE_CO_OWNER = 2;
}

// A member's access/approval role. OWNER is the founder (billing payer). CO_OWNER is
// also an authorized signer; ADMIN approves edits but does NOT sign the keyring;
// EDITOR proposes (needs approval); VIEWER is read-only.
enum MemberRole {
  MEMBER_ROLE_UNSPECIFIED = 0;
  MEMBER_ROLE_OWNER = 1;
  MEMBER_ROLE_CO_OWNER = 2;
  MEMBER_ROLE_ADMIN = 3;
  MEMBER_ROLE_EDITOR = 4;
  MEMBER_ROLE_VIEWER = 5;
}

// One key generation.
message KeyEpoch {
  // Matches Header.key_id.
  bytes key_id = 1;
  // Generation number, from 0.
  uint32 epoch = 2;
  // The DEK wrapped once per member.
  repeated KeyWrap wraps = 3;
}

// The DEK sealed for one member.
message KeyWrap {
  // Member account id (provider-agnostic).
  string member_id = 1;
  // How the DEK was wrapped.
  WrapMethod wrap_method = 2;
  // AEAD nonce for the wrap.
  bytes nonce = 3;
  // AEAD(DEK); its AAD binds (tree_id, key_id, member_id, wrap_method, epoch).
  bytes wrapped_dek = 4;
  // Set for the Argon2id wrap methods (WRAP_METHOD_PASSPHRASE_ARGON2ID and
  // WRAP_METHOD_RECOVERY_CODE_ARGON2ID). The recovery wrap uses minimal cost — its
  // input is a high-entropy code, so memory-hardness buys nothing.
  KdfParams kdf_params = 5;
  // Set for WRAP_METHOD_X25519_HPKE: the sender's one-time public key.
  bytes ephemeral_public_key = 6;
  // Set for the HPKE wrap methods (WRAP_METHOD_X25519_HPKE, WRAP_METHOD_RRK_HPKE): the RECIPIENT's public
  // key this wrap addresses. An UNAUTHENTICATED hint (the op author writes it; it is not cryptographically
  // tied to the ciphertext) used by the dag's epoch-coverage heuristic to detect a wrap addressed to a
  // member's STALE key after a rekey race — never a proof of decryptability (OPE-290).
  bytes recipient_public_key = 7;
}

// Argon2id parameters (explicit so cost can rise later).
message KdfParams {
  // Random per-member salt.
  bytes salt = 1;
  // Memory cost, KiB.
  uint32 memory_kib = 2;
  // Time cost (passes).
  uint32 iterations = 3;
  // Parallelism (lanes).
  uint32 parallelism = 4;
}

// How a DEK is wrapped for a member.
enum WrapMethod {
  WRAP_METHOD_UNSPECIFIED = 0;
  WRAP_METHOD_PASSPHRASE_ARGON2ID = 1;
  WRAP_METHOD_X25519_HPKE = 2;
  // A second wrap of the same DEK under a high-entropy printable recovery code, so a
  // lost passphrase isn't total data loss. A distinct value (not reusing PASSPHRASE)
  // makes the two wraps for one member unambiguous — wrap_method is in the wrap's AAD
  // tuple (§4), so they can't be swapped. Additive/non-breaking (open enum).
  WRAP_METHOD_RECOVERY_CODE_ARGON2ID = 3;
  // An epoch's DEK sealed (HPKE) to a RecoveryKey's public key, so the founder reaches
  // every epoch via one recovery root private key. Uses the per-epoch wrap binding.
  WRAP_METHOD_RRK_HPKE = 4;
}
