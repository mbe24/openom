# The signed-attestation sidecar (design.attestations.md): a member Ed25519-signs a fact's canonical
# content hash. Independent of the tree (not tree ops); rides the generic `journal` snapshot+op-log.
# This crate is the mechanism (record, verify, merge semantics) — authority (OPE-104) and the
# attester registry (OPE-105) layer on top.
[package]
name = "openom-attestations"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# Ed25519 signing/verifying of the vouch.
ed25519-dalek.workspace = true
serde.workspace = true
# Snapshot + op-log bytes for the journal substrate.
serde_json.workspace = true
thiserror.workspace = true
