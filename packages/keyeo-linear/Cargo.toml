[package]
name = "keyeo-linear"
description = "A generic linear signed-membership-chain engine over <Id, Role, Sig>: an ordered log of membership states where each revision N→N+1 is signed by a quorum of derived signers under a per-group governance rule, with a recovery authority and an anti-rollback floor. The domain-neutral core of openom's keyring chain (OPE-310). openom-free / dalek-free / standalone-publishable."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
keyeo-core.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
sha2 = "0.10"

[dev-dependencies]
# The reference concrete instantiation's signer is Ed25519 (keyeo-core's `Ed25519` scheme, edsign-backed);
# tests mint signing keys through edsign to author the engine's signed message. Test-only — the engine
# itself is signature-scheme-generic and never names edsign.
edsign.workspace = true
