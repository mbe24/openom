[package]
name = "store-media"
description = "openom — the durable media blob store: a content-addressed (sha256) SQLite table for photos/attachments, the Tauri host's local (non-synced) image cache. The web build uses an in-memory equivalent; this persists across a relaunch. Opaque bytes, dedup."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# The durable store: rusqlite (bundled SQLite). serde so the Tauri command layer returns the blob
# metadata/bytes structs straight to the webview. Content addressing (SHA-256) is the host's job now — it
# hashes the plaintext before sealing — so this crate no longer depends on sha2.
rusqlite = { workspace = true }
serde = { workspace = true }
# Versioned open (shared schema-drift policy: debug self-heal / release fail-closed).
store-schema = { workspace = true }

[lints]
workspace = true
