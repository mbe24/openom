[package]
name = "openom-keyring-chain"
description = "openom's linear signed-chain keyring binding: openom's roles/signing/keys + its own prost keyring wire, on the generic keyeo-linear engine. openom-domain-specific but openom-dependency-free (like openom-keyring-dag)."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# The generic linear signed-membership-chain engine this crate binds onto (OPE-300).
keyeo-linear.workspace = true
# The engine-family seam types (Ed25519 / SigError / Role / SignatureScheme).
keyeo-core.workspace = true
# The storage swap seam — the Blob transport for the keyring document (OPE-265).
blobstore.workspace = true
# The engine-agnostic swap seam — this crate provides the CHAIN KeyringVerifier adapter (OPE-277).
openom-keyring-api.workspace = true
# Ed25519 key types + the verify_strict-only verify (the raw ed25519-dalek edge lives only there).
edsign.workspace = true
# Hashing for the payload commitment.
sha2.workspace = true
# serde derive for the ChainRole (it appears in the engine's signed, serialized bytes).
serde = { workspace = true, features = ["derive"] }
# The chain owns its keyring wire as hand-written prost messages (moved out of openom-protocol, OPE-300).
prost.workspace = true
thiserror.workspace = true
# Only generate_identity (a random-seed test helper) needs a CSPRNG; gated behind `test-util`.
getrandom = { workspace = true, optional = true }

[features]
# Exposes generate_identity for downstream crates' tests. Off in production. Enabling it pulls getrandom.
test-util = ["dep:getrandom"]

[dev-dependencies]
proptest.workspace = true
# This crate's own tests use generate_identity, so getrandom is always present for the test build.
getrandom.workspace = true
