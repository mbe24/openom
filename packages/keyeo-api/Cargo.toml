[package]
name = "keyeo-api"
description = "The engine-agnostic keyring swap seam: MembershipView + its own generic role convention + the keyless KeyringVerifier trait, shared by the chain (openom-keyring) and dag (keyeo-dag) keyrings. openom-free / standalone-publishable (OPE-276/277/279)."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
# The generic membership-envelope wire (`MembershipEnvelope`) — a hand-written `#[derive(prost::Message)]`
# struct, so keyeo-api OWNS an efficient protobuf wire of its own (no borrowed openom proto, no buf/protoc
# codegen tooling). prost is generic, so the crate stays standalone-publishable.
prost.workspace = true

[dev-dependencies]
serde_json.workspace = true
