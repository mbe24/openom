[package]
name = "openom-sealer"
description = "openom — the client sealer: a stateful session that holds the unlocked DEK and seals/opens envelopes. Pure-Rust core + wasm-bindgen veneer (web) + used directly by Tauri (native)."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
# rlib for native (Tauri) + cargo test; cdylib for the wasm-bindgen build.
crate-type = ["rlib", "cdylib"]

[dependencies]
openom-protocol.workspace = true
openom-crypto.workspace = true
# The keyring/membership mechanism (chain verify, entry authorship, keyring signing) the vault drives.
openom-keyring.workspace = true
# The single home for the role constants (SIGNER_FOUNDER, MEMBER_OWNER, …) the vault compares against.
openom-roles.workspace = true
# did:key encoding of the member's PUBLIC identity key — the stable claim author id (createdBy).
openom-did.workspace = true
zeroize.workspace = true
thiserror.workspace = true

[features]
# The web binding. Off by default so native builds (Tauri, cargo test) never pull the
# wasm-bindgen glue. Build with: --no-default-features --features wasm --target wasm32-...
# The veneer marshals with plain wasm-bindgen (string enums, explicit params, Vec<u8> ↔
# Uint8Array) — no serde-wasm-bindgen, so no u64-as-BigInt or byte-array serialization
# quirks to reason about.
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies.wasm-bindgen]
version = "0.2"
optional = true

[dev-dependencies]
proptest.workspace = true
