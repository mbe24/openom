[package]
name = "openom-sealer"
description = "openom — the client DEK session: a stateful sealer that holds the unlocked DEK and seals/opens wire envelopes. The passphrase-driven keyring vault + wasm veneer live in openom-vault (OPE-279); this crate is engine-free so envelope-only consumers don't rebuild the keyring engines."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
# rlib only — the wasm cdylib veneer moved to openom-vault with wasm.rs (OPE-279).
crate-type = ["rlib"]

[dependencies]
openom-protocol.workspace = true
openom-crypto.workspace = true
# The author signing-key type threaded into a sealed entry's attribution. Named directly (was reached via
# an keyeo-chain re-export) so the lean sealer carries NO keyring-engine dependency (OPE-279).
openom-sign.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
# lib.rs tests mint an ad-hoc author identity via keyeo_chain::generate_identity (test-util gated). A
# dev-dependency, so it never enters a downstream consumer's build graph.
keyeo-chain = { workspace = true, features = ["test-util"] }
