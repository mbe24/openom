# openom-app-core — THE web app's one Rust core, meant to run in a single Web Worker (wasm). It owns the
# claim engine (openom-data-tree), the DEK sealer session (openom-vault / openom-sealer), the docsync sync
# loop, and one LOCAL durable DocStore (store-log). A thin Rust `Replicator` bridges that local log to the
# server; the only async is a ~1-screen JS worker-driver that does `fetch` around the core's synchronous
# steps. JS shrinks to UI + one network transport. See plan/sync/design.max-rust-app-core.md.
[package]
name = "openom-app-core"
description = "The web app's one Rust core (engine + sealer + docsync + local store + a local⇄server replicator), built for a single Web Worker. JS = UI + one fetch transport."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
# rlib = cargo test (the core logic + the replicator); cdylib = the wasm-bindgen module for the web worker.
crate-type = ["rlib", "cdylib"]

[features]
default = []
# The wasm veneer (AppCoreHandle + provision/unlock + the docId registry) + its glue — off by default so
# native test builds skip it. Pulls in openom-crypto (Passphrase) + openom-keyring-api (EngineKind) for the
# keyring lifecycle, and js-sys/web-sys (wall clock + OPFS handles). openom-vault is a hard rlib dep (below).
wasm = [
    "dep:wasm-bindgen",
    "dep:js-sys",
    "dep:web-sys",
    "dep:openom-crypto",
    "dep:openom-keyring-api",
]

[dependencies]
docsync = { path = "../docsync" }
openom-docsync = { path = "../openom-docsync" }
openom-data-tree.workspace = true
openom-data-crdt.workspace = true
openom-sealer = { path = "../openom-sealer" }
store-log.workspace = true
openom-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Recompute H(ciphertext) for the self-heal covered-set lookup (the header field is not AAD-bound — pin P1).
sha2.workspace = true

# A hard rlib dep: the §B3 verify-on-ingest seam (Membership / verify_ingest / Chain+DagMembership) lives
# here and gates AppCore::ingest in the core (non-wasm) build + tests, plus the rlib keyring lifecycle
# (AppVault / ChainVault) used by the wasm veneer. We take ONLY the rlib — NOT openom-vault's own
# #[wasm_bindgen] veneer: its `wasm` feature stays off, so its provision/unlock export symbols never compile
# into this cdylib to collide with app-core's own. Crypto's wasm CSPRNG comes from the getrandom_backend cfg
# in build-app-core.mjs.
[dependencies.openom-vault]
path = "../openom-vault"

[dependencies.openom-crypto]
path = "../openom-crypto"
optional = true

[dependencies.openom-keyring-api]
path = "../openom-keyring-api"
optional = true

[dependencies.wasm-bindgen]
version = "0.2"
optional = true

[dependencies.js-sys]
version = "0.3"
optional = true

[dependencies.web-sys]
version = "0.3"
optional = true

[dev-dependencies]
openom-crypto = { path = "../openom-crypto" }
openom-data-model = { path = "../openom-data-model" }
# The §B3 share→verify integration test drives the real keyring lifecycle + sharing ops: EngineKind for the
# engine tag, keyeo-crypto to encode the member's KDF params the way the wasm boundary does.
openom-keyring-api = { path = "../openom-keyring-api" }
keyeo-crypto = { path = "../keyeo-crypto" }
