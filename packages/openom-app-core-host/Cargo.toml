# openom-app-core-host — the NATIVE (Tauri desktop/mobile) host that runs openom-app-core as a native Rust
# core: the DEK + claim engine + local device store all live natively, and the keyring/watermark are held in a
# VaultStore (SQLite on Tauri), so the webview never sees the keyring anchor or the anti-rollback floor
# (OPE-427 full-native-core, Full-A). The Tauri #[command]s are thin wrappers over this host; the logic here is
# plain, cargo-tested Rust. One AppCore per doc, Mutex-guarded (Tauri dispatches invokes on a thread pool).
[package]
name = "openom-app-core-host"
description = "Native (Tauri) host running openom-app-core natively — DEK + engine + local store native, keyring/watermark via VaultStore."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# The one session core (rlib — never the wasm veneer): its store-generic lifecycle + AppCore.
openom-app-core = { path = "../openom-app-core" }
# The keyring/watermark custody seam (VaultStore) + the durable SQLite impl — reused, not re-derived.
openom-vault-host = { path = "../openom-vault-host" }
# The native local device store (a real BlobStore that passes the conformance suite).
store-blob = { path = "../store-blob" }
# The shared keyring/member MATH (sharing::provision_member / add_member / remove_member / change_role) — the
# SAME fns the wasm veneer + the thin-custody VaultHost call, so the member ops don't re-derive the crypto.
openom-vault = { path = "../openom-vault" }
openom-crypto = { path = "../openom-crypto" }
openom-keyring-api = { path = "../openom-keyring-api" }
# Claim values cross the invoke boundary as JSON strings (as they do the wasm veneer); parse them here.
serde_json.workspace = true
# The claim engine's error type (the host's mint methods go through AppCore::tree_mut).
openom-data-tree.workspace = true
thiserror.workspace = true
# The host MINTS a fresh replica id per open from the OS CSPRNG (never a webview argument — a repeated replica
# id forks the per-replica counter chain, so its freshness is a security property, not a caller's choice).
getrandom.workspace = true
# The lifecycle-result structs (Provisioned/Unlocked) are wire-shaped: the Tauri #[command] veneer returns
# them straight to the webview, so they derive Serialize here rather than being mirrored crate-side.
serde.workspace = true

[features]
# Durable keyring/watermark via SQLite (the Tauri deployment). Tests use an in-memory fake VaultStore.
sqlite = ["openom-vault-host/sqlite"]
