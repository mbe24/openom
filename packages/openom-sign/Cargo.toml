# The Ed25519 sign/verify seam — the ONE crate in the workspace that depends on ed25519-dalek. Every
# other crate goes through the newtypes here (`SigningKey` / `VerifyingKey` / `Signature`), so the raw
# `Verifier::verify` (which skips the small-order / torsion checks) is not in scope anywhere else and the
# weak verify path cannot be written by construction — the policy is "always verify_strict", enforced at
# `cargo build`, not by a lint. Pure + RNG-free + serde-free (identities are minted by callers via
# `from_seed`), so it is deterministic and wasm-trivial. See OPE-205.
[package]
name = "openom-sign"
description = "The single Ed25519 dependency edge: newtype SigningKey/VerifyingKey/Signature whose only verify is verify_strict, so the weak Verifier::verify path is uncallable outside this crate (compile-time signature-verification policy)."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# The only place this appears in the workspace. `zeroize` feature = the signing seed scrubs on drop.
# The ONE ed25519-dalek edge in the workspace: a direct, explicit-version dep (NOT a
# [workspace.dependencies] entry), so no other crate can casually draw `ed25519-dalek.workspace = true`
# and roll its own plain verify. openom-sign is the sole, auditable Ed25519 dependency (OPE-215).
ed25519-dalek = { version = "2", features = ["zeroize"] }
# For the compile-time ZeroizeOnDrop proof on the signing key.
zeroize.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
