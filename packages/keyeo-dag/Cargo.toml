[package]
name = "keyeo-dag"
description = "The DAG keyring engine: openom's roles/signing/keys wired onto the generic keyeo group-membership DAG (sequencer-free keyring, OPE-137). openom-free — binds roles to keyeo-api's convention and derives its recovery key through edsign, so it's standalone-publishable."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
keyeo.workspace = true
blobstore.workspace = true
keyeo-api.workspace = true
edsign.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The differential-oracle + seam-parity tests drive the openom chain keyring (openom-keyring) alongside
# the DAG one and assert they agree ("CAS = degenerate DAG"), against openom's own roles/proto vocabulary.
# openom-coupled but TEST-ONLY — the published library (its [dependencies]) stays openom-free.
openom-keyring.workspace = true
openom-protocol.workspace = true
openom-roles.workspace = true
proptest.workspace = true
tempfile = "3"
