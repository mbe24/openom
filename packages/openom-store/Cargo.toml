[package]
name = "openom-store"
version = "0.1.0"
description = "openom — DocStore: opaque byte persistence with CAS semantics"
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
