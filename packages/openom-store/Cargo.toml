[package]
name = "openom-store"
description = "openom — DocStore (opaque byte persistence, CAS) + backend client"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# Shared model + crypto: the client seals and serialises with the same crates the
# server validates against.
openom-protocol.workspace = true
openom-crypto.workspace = true

# Local DocStore (memory + sqlite) and its conformance suite.
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rusqlite.workspace = true

# The backend client transport — reqwest (upload) + zstd (compress) — is added
# with the upload path itself, so its rustls provider can be chosen against a real
# HTTPS call. Both are staged in the workspace's [workspace.dependencies].
