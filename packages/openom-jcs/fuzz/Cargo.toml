# cargo-fuzz targets for openom-jcs's canonicalization boundary. This is a DETACHED crate (its own
# empty [workspace]) so it never touches the stable workspace build — the main crates build on
# stable in the container; these run under nightly libFuzzer:
#   cd packages/openom-jcs && cargo +nightly fuzz run canonicalize
# The stable proptests (deterministic, idempotent, floats_rejected) cover the same surface for CI;
# this is for deep, corpus-driven fuzzing.
[package]
name = "openom-jcs-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
openom-jcs = { path = ".." }
serde_json = "1"

[[bin]]
name = "canonicalize"
path = "fuzz_targets/canonicalize.rs"
test = false
doc = false
bench = false

[workspace]
