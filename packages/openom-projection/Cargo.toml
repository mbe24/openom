# openom-projection — the read-time projection: a pure function from the claim record set to the
# materialized read model, and the substrate's critical path (design.substrate-adaptation §7).
#
# This is increment 1: the deterministic identity-clustering core (§11 constraint-repair union-find
# over same_as / different_from, the same routine keyeo-dag's StrongRemove uses), person-id
# canonicalization, and person assembly (names + sex), with tombstone suppression. Because the whole
# thing is a pure function of the record set, replicas converge without a shared clock — verified by
# an order-independence property test. Still to come: attestation-weighted confidence, `preferred`,
# `reattribute_to`, events/EDTF views, the role-gated tombstone (needs the role feed), and SQLite
# materialization.
[package]
name = "openom-projection"
description = "Read-time projection of the claim record set into a materialized read model: deterministic same_as/different_from constraint-repair clustering + person-id canonicalization + person assembly. A pure function of the records, so replicas converge without a shared clock."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
# For the attestation-weighted identity confidence: an attestation targets a fact's fingerprint
# (sha256(JCS(targetId,predicate,value))), so the projection recomputes it to match votes to edges.
openom-claim.workspace = true
jcs.workspace = true
# Event dates are EDTF strings, normalized to sortable year bounds for the timeline view.
edtf.workspace = true

[dev-dependencies]
proptest.workspace = true
