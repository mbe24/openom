# openom-oplog — the operations channel of the claim data model. Holds the operation type and the
# set-union fold that materializes the live record set (the snapshot) from a grow-only op set. It is
# domain-agnostic: it folds opaque records and tracks their liveness (assert / remove / supersede /
# revoke), but never interprets a claim's meaning — that is openom-projection's job. The projection can
# never name these types, keeping the data and operations channels structurally separate
# (design.data-model-claims.v1.md §8.2 / principle 6). This is the claim-model successor to the op-log
# half of openom-treelog, minus commute's Lamport ordering: convergence is by set-union, no shared clock.
[package]
name = "openom-oplog"
description = "The operations channel of the claim data model: the Operation type plus the set-union fold that materializes the live record set from a grow-only op set (assert/remove/supersede/revoke, same-author observed-remove). Domain-agnostic and clock-free, so replicas converge without coordination."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The records an operation asserts/supersedes are openom-claim Records; ContentAddressed is the shared
# hashing seam so an Op computes its id through the exact same JCS path a Claim does.
openom-claim.workspace = true

[dev-dependencies]
proptest.workspace = true
