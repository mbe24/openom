[package]
name = "openom-keyring"
description = "openom — the keyring/membership mechanism: keyring chain verification, entry authorship, signing"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# Wire types (Keyring / Member / Header) + the canonical signing-byte encoders.
openom-protocol.workspace = true
# The storage swap seam — the Blob transport for the keyring document (OPE-265).
blobstore.workspace = true
# Primitives layer — the shared CryptoError this crate returns (keyring/membership builds on crypto).
openom-crypto.workspace = true
# The capability→role policy verify_entry enforces.
openom-roles.workspace = true
# Ed25519 key types + the verify_strict-only verify (the raw ed25519-dalek edge lives only there).
openom-sign.workspace = true
# did:key encoding of a member's public key — for the moderator role feed the claim fold consumes.
openom-did.workspace = true
thiserror.workspace = true
sha2.workspace = true
# Only generate_identity (a random-seed test helper) needs a CSPRNG; gated behind `test-util` so
# production never mints a non-recoverable random identity (real identities are passphrase-derived).
getrandom = { workspace = true, optional = true }

[features]
# Exposes generate_identity for downstream crates' tests. Off in production. Enabling it pulls getrandom.
test-util = ["dep:getrandom"]

[dev-dependencies]
proptest.workspace = true
# This crate's own tests use generate_identity, so getrandom is always present for the test build.
getrandom.workspace = true
