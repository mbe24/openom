# openom-tree — the app-facing family-tree engine. Increment A here is the pure engine (rlib): it
# COMPOSES openom-crdt (the set-union `materialize` fold) + openom-projection (the read model) into the
# read+write surface the app talks to. It owns the in-memory record set + the local author id, mints
# ops as batch bytes for the transport to seal, merges peers' batches, snapshots/loads, and projects.
# Key-less — it never holds the DEK (sealing is the transport's / sealer-worker's job). Takes over
# openom-treelog's engine role. Increment B adds the #[wasm_bindgen] veneer + build-tree.mjs.
[package]
name = "openom-tree"
description = "The app-facing family-tree engine: composes openom-crdt (set-union fold) + openom-projection (read model) into a read+write surface. Owns the in-memory record set + author id; mints op batches for the transport to seal, merges, snapshots, and projects. Key-less. Takes over openom-treelog's engine role."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde_json.workspace = true
thiserror.workspace = true
openom-claim.workspace = true
openom-crdt.workspace = true
openom-projection.workspace = true
