[package]
name = "openom-crypto"
description = "openom — shared symmetric crypto primitives (client & server, identical algorithms)"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# The generic, openom-free crypto primitives (AEAD cores, KDF/root derivation, HPKE wraps, typed
# secrets, recovery codes). This crate is the thin proto-bound layer over them (OPE-305).
keyeo-crypto.workspace = true
# Header type + the canonical §5 AAD encoder (seal/open bind the whole header).
openom-protocol.workspace = true
# Ed25519 author-signing key on `AuthorIdentity` (envelope.rs); the seam, never raw dalek (OPE-205).
edsign.workspace = true
# The `Kdf` type alias (argon2::Argon2) kept in the public surface.
argon2.workspace = true
zeroize.workspace = true
getrandom.workspace = true
# SHA-256 for the ciphertext hash (envelope.rs) and the dev DEK.
sha2.workspace = true

[dev-dependencies]
proptest.workspace = true
# Structured fuzz input: proptest supplies the entropy, `arbitrary` shapes it into a typed
# SealInput (tests/prop.rs). The nightly cargo-fuzz crate (fuzz/) reuses the same derive for
# deep corpus runs; this dev-dep is what makes the structured fuzzing runnable on stable.
arbitrary = { version = "1.4.2", features = ["derive"] }

# WASM (the web sealer) needs getrandom's browser backend enabled — only for wasm32;
# native uses the OS RNG directly. Several getrandom majors reach this crate
# transitively (via the crypto deps), each with its own wasm feature, so enable all of
# them (renamed, so the same crate can appear more than once). Pair with
# RUSTFLAGS=--cfg getrandom_backend="wasm_js" at the wasm build step.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_v04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
getrandom_v02 = { package = "getrandom", version = "0.2", features = ["js"] }
