[package]
name = "openom-vault-host"
description = "openom — the native (Tauri) key-custody host: keeps live Sealer sessions and the keyring/watermark storage in Rust, so the DEK never enters the webview. The Tauri #[command]s are thin wrappers over this; the logic is plain, cargo-tested Rust."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
openom-sealer = { path = "../openom-sealer" }
openom-crypto.workspace = true
# Keyring chain verification (verify_walk/verify_transition/verify_reset) the host re-checks on sync.
openom-keyring.workspace = true
# EngineKind — the deployment's keyring engine preset the host builds an AppVault from (OPE-278).
openom-keyring-seam.workspace = true
openom-protocol.workspace = true
serde = { workspace = true }
zeroize.workspace = true
rusqlite = { workspace = true, optional = true }

[features]
default = []
# A durable SqliteVaultStore for the Tauri host. Off by default so the pure logic + its tests
# build without SQLite; the Tauri crate turns it on.
sqlite = ["dep:rusqlite"]

[dev-dependencies]
# Tests mint ad-hoc signer identities via openom_keyring::generate_identity (test-util gated).
openom-keyring = { workspace = true, features = ["test-util"] }
