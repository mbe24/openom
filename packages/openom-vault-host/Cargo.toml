[package]
name = "openom-vault-host"
description = "openom — the native keyring/watermark custody seam: the VaultStore trait + its durable SQLite backing (the Tauri host persists the wrapped DEK + anti-rollback cursor here). The DEK/engine/session logic now lives in openom-app-core-host."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# The durable SqliteVaultStore (Tauri deployment) is backed by rusqlite, opened through store-schema's versioned
# open (the shared schema-drift policy: debug self-heal / release fail-closed).
rusqlite = { workspace = true, optional = true }
store-schema = { workspace = true, optional = true }

[features]
default = []
# The durable SqliteVaultStore for the Tauri host. Off by default so the VaultStore trait + its in-memory test
# build without SQLite; the Tauri crate turns it on.
sqlite = ["dep:rusqlite", "dep:store-schema"]

[lints]
workspace = true
