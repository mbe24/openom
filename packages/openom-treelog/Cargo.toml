[package]
name = "openom-treelog"
description = "openom — the family-tree domain layer: sourced-claim facts and relationships composed over the commute op-based CRDT. Pure-Rust core + wasm-bindgen veneer (web) + used directly by Tauri (native)."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
# rlib for native (Tauri) + cargo test; cdylib for the wasm-bindgen build.
crate-type = ["rlib", "cdylib"]

[dependencies]
commute.workspace = true

[features]
# The web binding. Off by default so native builds (Tauri, cargo test) never pull the
# wasm-bindgen glue. The veneer marshals ids/bytes as Uint8Array and the (nested) read model as
# JSON strings via serde_json — non-secret display data, so no serde-wasm-bindgen bridge needed.
default = []
wasm = ["dep:wasm-bindgen", "dep:serde", "dep:serde_json"]

[dependencies.wasm-bindgen]
version = "0.2"
optional = true

[dependencies.serde]
workspace = true
optional = true

[dependencies.serde_json]
workspace = true
optional = true

[dev-dependencies]
proptest.workspace = true
