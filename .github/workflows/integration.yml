name: integration

# The server contract suite (openom/tests/api.rs + the storage checksum test) against a LIVE Postgres + MinIO.
# These are the `#[ignore]`d integration tests the compile/unit jobs never run, so without this gate a
# client<->server contract regression (the BlobStore-over-HTTP conformance, keyring/access/media/proposals/GC
# semantics) is only caught by running `node scripts/itest.mjs` locally. This runs them on every push/PR.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  server-contract:
    runs-on: ubuntu-latest
    env:
      # Mirrors docker-compose.yml / scripts/itest.mjs, with the stack reached at localhost (published ports).
      # RUN_MODE=local presets storage=local (MinIO) + auth=dev + the /dev routes the media/log GC tests use;
      # the S3/DB endpoints still come from the explicit vars below (RUN_MODE never overrides those).
      RUN_MODE: local
      DATABASE_URL: postgres://openom:openom@localhost:5432/openom
      S3_ENDPOINT: http://localhost:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_BUCKET: openom-trees
      S3_REGION: us-east-1
      S3_ACCESS_KEY: openom
      S3_SECRET_KEY: openompw123
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      # Build the contract suite FIRST — this is the slow, cacheable part and needs no services. Doing it before
      # the stack means: a compile error fails fast, the build lands in the cache, and a transient hiccup when
      # starting the stack never wastes (or re-does) the compile — a re-run reuses the cached binary and only
      # re-runs the tests.
      - name: Build the contract suite
        run: cargo test -p openom --no-run --locked

      # Postgres + MinIO from the repo's own compose (docker compose v2 is preinstalled on ubuntu-latest). ONLY
      # these two — NOT the `server` service (the tests run the router in-process) nor the profile-gated `lgtm`.
      # MinIO's image is quay.io/minio/minio (Docker Hub removed minio/minio in 2025; the compose points there).
      - name: Start Postgres + MinIO
        run: docker compose up -d postgres minio

      - name: Wait for Postgres + MinIO
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U openom -d openom && break
            echo "waiting for postgres ($i/30)"; sleep 2
          done
          for i in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/ready && echo " minio ready" && break
            echo "waiting for minio ($i/30)"; sleep 2
          done

      # Binary already built above, so this only RUNS the suite (no recompile). The server self-initializes on the
      # first request: sqlx migrations + dev account + ensure_bucket()s openom-trees. --test-threads=1 because the
      # suite shares one stack and uses global GC sweeps (parallel runs make shared-state assertions flaky).
      - name: Server contract suite
        run: cargo test -p openom -- --ignored --test-threads=1 --nocapture

      - name: Stop the stack
        if: always()
        run: docker compose down -v
