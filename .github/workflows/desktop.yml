name: desktop

# Tauri-Anwendung fuer Windows, macOS und Linux. Hier laeuft auch die
# Konformitaets-Suite des Stores: MemoryStore und SqliteStore muessen sich
# gleich verhalten.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Clippy-Gate: laeuft ZUERST und einmalig (Linux). Faellt es durch, startet die
  # Matrix (Windows/macOS/Linux) gar nicht erst — kein OS-Build ohne saubere Lints.
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      # Tauri (openom-tauri) wird unter --all-features mitkompiliert und braucht WebKitGTK.
      - name: System libraries (Linux)
        run: |
          sudo apt-get update
          # libappindicator3-dev und libayatana-appindicator3-dev schliessen
          # einander aus — Tauri 2 will die Ayatana-Fassung.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file \
            libssl-dev libgtk-3-dev

      # clippy::pedantic + clippy::cargo sind in [workspace.lints.clippy] als `deny`
      # verdrahtet, ein Fund bricht hier ab. --all-features deckt den Feature-Code
      # (wasm/sqlite/profiling) ab.
      - name: Clippy (pedantic + cargo gate)
        run: cargo clippy --workspace --all-features

  build:
    needs: clippy
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      # Nur Linux braucht die Systembibliotheken von WebKitGTK.
      - name: System libraries (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # libappindicator3-dev und libayatana-appindicator3-dev schliessen
          # einander aus — Tauri 2 will die Ayatana-Fassung.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file \
            libssl-dev libgtk-3-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      # Ohne pnpm-lock.yaml bricht setup-node mit "cache" ab. Sobald ein
      # Lockfile committet ist: cache: pnpm hier, --frozen-lockfile unten.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Kein Lockfile im Baum — sobald eines committet ist, gehoert hier
      # --frozen-lockfile hin, damit CI nicht heimlich aktualisiert.
      - run: pnpm install --no-frozen-lockfile
        working-directory: apps

      - name: Store conformance suite
        run: cargo test --workspace --all-features

      - run: pnpm tauri build --no-bundle
        working-directory: apps
