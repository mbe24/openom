name: Deploy to GitHub Pages

# Publishes the web app to GitHub Pages. There is nothing to build — app/ ships
# exactly as Tauri loads it; only %SITE_URL% is filled in.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Visitors land in the app, not in a preview page. The device frames sit
      # next to it under /preview.html.
      # .nojekyll: otherwise Pages swallows folders with a leading underscore.
      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r apps/app/. _site/
          cp -r assets _site/assets
          cp apps/preview/desktop.html _site/preview.html
          sed -i 's#\.\./app/index.html#index.html#g' _site/preview.html
          touch _site/.nojekyll

      # Absolute origin for the social-preview meta. The deploy knows its own
      # URL, so .env.demo is only the fallback for local and fork runs.
      - name: Fill in SITE_URL
        working-directory: apps
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/site-url.mjs ../_site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
