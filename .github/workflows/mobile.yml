name: mobile

# Android und iOS — ein OPTIONALER Build-Check, nur manuell (workflow_dispatch). Die SDKs machen jeden Lauf
# teuer, und es gibt noch keine Release-/Signatur-Pipeline: das hier verifiziert nur, dass die Tauri-Mobile-App
# baut. Es produziert UNSIGNED --debug-Artefakte (Build-Check / QA), KEINE Store-Releases. iOS nur auf macOS.
# Wenn die echte, signierte Release-Pipeline kommt, MUSS sie --release nutzen (kein debug_assertions).

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Android NDK
        run: sdkmanager --install "ndk;26.1.10909125"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      # Ohne pnpm-lock.yaml bricht setup-node mit "cache" ab. Sobald ein
      # Lockfile committet ist: cache: pnpm hier, --frozen-lockfile unten.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Kein Lockfile im Baum — sobald eines committet ist, gehoert hier
      # --frozen-lockfile hin, damit CI nicht heimlich aktualisiert.
      - run: pnpm install --no-frozen-lockfile
        working-directory: apps

      # gen/android is gitignored, so CI starts from a blank slate — scaffold it before building. --nostart keeps
      # init non-interactive (it does not try to open Android Studio / an emulator wrapper).
      - name: Initialize Android scaffolding
        run: pnpm tauri android init --nostart
        working-directory: apps

      # NOTE: --debug builds with debug_assertions ON, so this APK CONTAINS the dev-only destructive schema-reset
      # (store-schema). That is fine for a build-verification / QA artifact but this is NOT a store release — the
      # real signed release pipeline must use --release (no debug_assertions). Hence the artifact name below.
      - name: Build (debug APK, unsigned)
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: pnpm tauri android build --apk --debug
        working-directory: apps

      - uses: actions/upload-artifact@v4
        with:
          name: openom-android-debug
          path: apps/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      # Ohne pnpm-lock.yaml bricht setup-node mit "cache" ab. Sobald ein
      # Lockfile committet ist: cache: pnpm hier, --frozen-lockfile unten.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Kein Lockfile im Baum — sobald eines committet ist, gehoert hier
      # --frozen-lockfile hin, damit CI nicht heimlich aktualisiert.
      - run: pnpm install --no-frozen-lockfile
        working-directory: apps

      # gen/apple is gitignored, so CI starts from a blank slate — scaffold it before building.
      - name: Initialize iOS scaffolding
        run: pnpm tauri ios init
        working-directory: apps

      # Ohne Signaturzertifikat nur bis zum Simulator-Build — mehr braucht eine Pruefung nicht, und Geheimnisse
      # gehoeren nicht in einen Fork. --debug: same caveat as Android — a build-check artifact, not a release.
      - name: Build (simulator, unsigned)
        run: pnpm tauri ios build --target aarch64-sim --debug
        working-directory: apps
