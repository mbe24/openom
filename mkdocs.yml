site_name: openom
site_description: A local-first, end-to-end-encrypted family tree — one Rust core across desktop, mobile, and the browser
site_url: https://openom.readthedocs.io/
repo_url: https://github.com/mbe24/openom
repo_name: mbe24/openom
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

theme:
  name: material
  palette:
    - scheme: default
      primary: green
      accent: light green

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Concepts: concepts.md
  - Architecture: architecture.md
  - Getting started: getting-started.md
