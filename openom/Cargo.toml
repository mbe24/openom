[package]
name = "openom"
description = "openom — server: Axum on AWS Lambda (Monolith-on-FaaS)"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# Off by default → zero cost in the release build. Enable (`--features profiling`, or in a debug/dev
# build) to emit per-scope timing spans on the hot paths (see `prof`).
default = []
profiling = []

[dependencies]
# Shared model + crypto (identical to the client's). The server never decrypts
# trees (zero-knowledge), but it validates and serialises against the same code.
openom-protocol.workspace = true
openom-crypto.workspace = true
# The capability→role policy (advisory ACL gate) and the keyring chain the server re-verifies as
# honest-server defense-in-depth. Both are content-agnostic — the server still never decrypts.
openom-roles.workspace = true
keyeo-chain.workspace = true
# The engine-agnostic keyless verifier seam (KeyringVerifier/MembershipView): the server binds this and
# dispatches on a per-tree engine tag, so chain and (soon) dag admit through one surface (OPE-278).
keyeo-api.workspace = true

# The whole HTTP surface in one Lambda: Axum routing over the Lambda runtime.
axum.workspace = true
lambda_http.workspace = true
tokio.workspace = true

# Metadata DB: Postgres (Neon in prod, a local container in dev).
sqlx.workspace = true
uuid.workspace = true

# Blob store: rusty-s3 signs S3 requests / presigned URLs, reqwest sends the bytes;
# sha2 hashes ciphertext for the upload-integrity check. MinIO (dev) / R2 (prod).
rusty-s3.workspace = true
reqwest.workspace = true
sha2.workspace = true
url.workspace = true
base64.workspace = true
thiserror.workspace = true

# Auth: Supabase JWT validation (prod); fake-token bypass (local).
jsonwebtoken.workspace = true

# JSON claims + responses.
serde.workspace = true
serde_json.workspace = true

# Structured logging: pretty locally, JSON in prod. OTLP export (opt-in) turns the
# same spans into traces for grafana/otel-lgtm (dev) / Better Stack (prod).
tracing.workspace = true
tracing-subscriber.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
tracing-opentelemetry.workspace = true
tower-http.workspace = true

[dev-dependencies]
# Integration tests drive the router in-process via ServiceExt::oneshot (no socket).
tower = { version = "0.5", features = ["util"] }
# tests/api.rs mints ad-hoc signer identities via keyeo_chain::generate_identity (test-util gated).
keyeo-chain = { workspace = true, features = ["test-util"] }
# Metering tests seed accounts with tiny caps directly, to drive the rate/capacity gates.
sqlx.workspace = true
