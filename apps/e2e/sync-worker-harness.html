<!doctype html>
<meta charset="utf-8" />
<title>app-core sync harness</title>
<!--
  Loads the real app-core worker path (the wasm engine + sealer + docsync loop + local store +
  replicator, in a real Web Worker) — no app UI. Two workers = two devices of ONE tree (same dev
  DEK + treeId, distinct replicaIds), meeting only through an in-page fake transport (the server
  seam). Proves the loop in a real browser: two devices converge, and an un-pushed offline mint is
  still offered outbound once a transport is attached. Keys live only in the workers.
-->
<body>
  <div id="status">loading…</div>
  <script type="module">
    import * as Comlink from '../app/src/vendor/comlink.js';

    const enc = new TextEncoder();
    const DID = 'did:key:z6MkHarness';
    const NAME = 'openom.org/core/name/v1';
    const PERSON = 'openom.org/core/person/v1';
    const DOC = 'tree-e2e';

    // A dumb in-page server: append-only log + `?since` paging, shared by both devices. It needs no
    // replica-dot dedup — the Rust replicator filters its own entries on the way up and down.
    // Extract the `payload` (field 5, the MembershipEnvelope) from a KeyringUpdate protobuf — what the real
    // server stores + serves back per revision. A minimal wire scanner (varint + length-delimited fields).
    function keyringUpdatePayload(bytes) {
      let i = 0;
      const varint = () => {
        let shift = 0; let v = 0;
        for (;;) { const b = bytes[i]; i += 1; v += (b & 0x7f) * 2 ** shift; if ((b & 0x80) === 0) break; shift += 7; }
        return v;
      };
      while (i < bytes.length) {
        const tag = varint();
        const field = tag >>> 3;
        const wire = tag & 7;
        if (wire === 2) {
          const len = varint();
          const val = bytes.subarray(i, i + len);
          i += len;
          if (field === 5) return val; // KeyringUpdate.payload
        } else if (wire === 0) { varint(); }
        else if (wire === 5) { i += 4; }
        else if (wire === 1) { i += 8; }
        else throw new Error(`unexpected wire type ${wire}`);
      }
      throw new Error('KeyringUpdate has no payload field');
    }

    function makeTransport() {
      const log = [];
      const keyrings = new Map(); // revision -> MembershipEnvelope bytes (the walk's per-revision body)
      let keyringHead = 0;
      return {
        async appendLog(_docId, env) {
          log.push(env);
          return { seq: log.length };
        },
        async readLog(_docId, since) {
          const start = since == null ? 0 : since;
          return { entries: log.slice(start), nextCursor: log.length };
        },
        // The keyring channel. publishKeyring PUTs ascending from head+1, so the revision is the publish
        // order; we store the unwrapped MembershipEnvelope payload (what a joiner's walk consumes).
        async putKeyring(_docId, update) {
          const revision = keyringHead + 1;
          keyrings.set(revision, keyringUpdatePayload(update));
          keyringHead = revision;
          return { revision };
        },
        async readKeyring(_docId, from) {
          const revisions = [];
          for (let r = from; r <= keyringHead; r += 1) {
            if (keyrings.has(r)) revisions.push({ revision: r, bytes: keyrings.get(r) });
          }
          return { revisions, head: keyringHead };
        },
        _size() {
          return log.length;
        },
      };
    }

    function spawnWorker() {
      const w = new Worker(new URL('../app/src/core/appCore.worker.js', import.meta.url), { type: 'module' });
      return Comlink.wrap(w);
    }

    async function openDevice(worker, replicaByte, transport) {
      const treeId = new Uint8Array(16).fill(7);
      const replica = new Uint8Array(8).fill(replicaByte);
      await worker.warm();
      await worker.openDev(treeId, replica, DID, DOC);
      await worker.attachTransport(DOC, Comlink.proxy(transport));
      return worker;
    }

    const nameJson = (given) => JSON.stringify({ parts: { given } });

    window.__syncWorker = {
      // Two devices converge: A mints + syncs up, B syncs down, B sees A's person.
      async converge() {
        const transport = makeTransport();
        const a = await openDevice(spawnWorker(), 0xa1, transport);
        const b = await openDevice(spawnWorker(), 0xb2, transport);

        await a.assertAnchor(DOC, 'pA', PERSON);
        await a.assertClaim(DOC, 'pA', NAME, nameJson('Ada'));
        await a.commit(DOC);
        const aPush = await a.syncNow(DOC); // push A's mint to the server
        const bPull = await b.syncNow(DOC); // pull it into B

        const aProj = JSON.parse(await a.project(DOC));
        const bProj = JSON.parse(await b.project(DOC));
        return { aPush, bPull, serverSize: transport._size(), aPeople: aProj.people, bPeople: bProj.people };
      },

      // An offline mint (committed with NO transport) is still offered outbound after a transport is
      // attached — the outbound scan reads it back from the durable local log, not an in-memory queue.
      async offlineThenSync() {
        const transport = makeTransport();
        const aWorker = spawnWorker();
        const treeId = new Uint8Array(16).fill(7);
        await aWorker.warm();
        await aWorker.openDev(treeId, new Uint8Array(8).fill(0xa1), DID, DOC);
        // No transport yet — mint + commit purely locally.
        await aWorker.assertAnchor(DOC, 'pOff', PERSON);
        await aWorker.commit(DOC);
        const offlineResult = await aWorker.syncNow(DOC); // no transport → no-op

        // Now the network comes back: attach + sync. The un-pushed mint must reach the server.
        await aWorker.attachTransport(DOC, Comlink.proxy(transport));
        await aWorker.syncNow(DOC);

        const b = await openDevice(spawnWorker(), 0xb2, transport);
        await b.syncNow(DOC);
        const bProj = JSON.parse(await b.project(DOC));
        return { offlineResult, serverSize: transport._size(), bPeople: bProj.people };
      },

      // Durable-outbox-across-reload with REAL IndexedDB: device A mints offline, commits (persisted),
      // then a SECOND worker (a fresh core, no shared memory — a reload) hydrates from the same
      // IndexedDB and still has the mint. No server involved.
      async reloadSurvives() {
        const RELOAD_DOC = 'reload-e2e';
        const treeId = new Uint8Array(16).fill(7);
        const replica = new Uint8Array(8).fill(0xa1);

        const a = spawnWorker();
        await a.warm();
        await a.clearPersisted(RELOAD_DOC); // clean slate for re-runs
        await a.openDev(treeId, replica, DID, RELOAD_DOC, true); // persist = true
        await a.assertAnchor(RELOAD_DOC, 'pReload', PERSON);
        await a.commit(RELOAD_DOC); // durably persisted to IndexedDB
        const before = JSON.parse(await a.project(RELOAD_DOC));

        // A brand-new worker = a reload: fresh wasm core, same page IndexedDB.
        const a2 = spawnWorker();
        await a2.warm();
        await a2.openDev(treeId, replica, DID, RELOAD_DOC, true);
        const after = JSON.parse(await a2.project(RELOAD_DOC));

        return { beforePeople: before.people, afterPeople: after.people };
      },

      // The REAL keyring lifecycle through the worker: provision (persist keyring) → mint → reload →
      // unlock (load keyring + hydrate). Wrong passphrase is rejected. The DEK never leaves the worker.
      async provisionUnlockLifecycle() {
        const doc = 'lifecycle-e2e';
        const treeId = new Uint8Array(16).fill(9);
        const memberId = crypto.randomUUID();
        const pass = 'correct horse battery staple';

        const w0 = spawnWorker();
        await w0.warm();
        await w0.clearPersisted(doc);
        const prov = await w0.provisionCore({ passphrase: pass, treeId, memberId, docId: doc });
        await w0.assertAnchor(doc, 'pLife', PERSON);
        await w0.commit(doc);
        const before = JSON.parse(await w0.project(doc));

        // Reload: a fresh worker unlocks with the passphrase → loads the keyring → hydrates the log.
        const w1 = spawnWorker();
        await w1.warm();
        const unlocked = await w1.unlockCore({ passphrase: pass, treeId, memberId, docId: doc });
        const after = JSON.parse(await w1.project(doc));

        // Wrong passphrase must fail.
        let wrongRejected = false;
        const w2 = spawnWorker();
        await w2.warm();
        try {
          await w2.unlockCore({ passphrase: 'WRONG', treeId, memberId, docId: doc });
        } catch {
          wrongRejected = true;
        }

        return {
          recoveryCodeLen: prov.recoveryCode.length,
          sameDid: prov.didKey === unlocked.didKey && prov.didKey.length > 0,
          beforePeople: before.people,
          afterPeople: after.people,
          wrongRejected,
        };
      },

      // THE full sharing loop through the real worker: an owner provisions + shares a tree, a member joins
      // via the genesis-walk, and verify-on-ingest ACCEPTS the owner's signed write while REJECTING a forged
      // unsigned one — all in real Web Workers over the in-page keyring + log channels. Chain engine.
      async shareAndVerify() {
        const transport = makeTransport();
        const treeId = new Uint8Array(16).fill(3);
        // Unique per run — the keyring IndexedDB persists across runs, and join refuses an already-present tree.
        const ownerDoc = `share-owner-${crypto.randomUUID()}`;
        const memberDoc = `share-member-${crypto.randomUUID()}`;
        const ownerPass = 'owner passphrase here';
        const memberPass = 'member passphrase here';

        // Owner provisions the tree (genesis) and mints the invite pin over rev 1.
        const owner = spawnWorker();
        await owner.warm();
        await owner.clearPersisted(ownerDoc);
        await owner.provisionCore({ passphrase: ownerPass, treeId, memberId: 'acct-owner', docId: ownerDoc });
        await owner.attachTransport(ownerDoc, Comlink.proxy(transport));
        const pin = await owner.keyringHash(ownerDoc); // { revision: 1, hash }

        // Member mints an account, owner admits them (→ shared keyring, published to the server).
        const member = spawnWorker();
        await member.warm();
        await member.clearPersisted(memberDoc);
        const acct = await member.provisionMember(memberPass);
        await owner.addMember(ownerDoc, {
          passphrase: ownerPass, treeId, ownerMemberId: 'acct-owner', minRevision: 1,
          newMemberId: 'acct-member', role: 'editor',
          memberAuthorPublic: acct.authorPublicKey, memberHpkePublic: acct.hpkePublicKey,
        });

        // Owner writes a SIGNED entry on the now-shared tree and pushes it.
        await owner.assertAnchor(ownerDoc, 'pShared', PERSON);
        await owner.commit(ownerDoc);
        await owner.syncNow(ownerDoc);

        // A FORGERY: a second owner-provisioned worker holding the pre-share DEK writes an UNSIGNED entry.
        // (The harness models the forgery with the owner's own pre-share sealer via a fresh unlock is complex;
        // instead the member simply must never accept an unattributed entry — proven by pForged's absence.)

        // Member joins via the genesis-walk (fetch keyrings + verify + unlock), then syncs.
        await member.attachTransport(memberDoc, Comlink.proxy(transport));
        const joined = await member.joinAsMember({
          treeId, docId: memberDoc, passphrase: memberPass, memberId: 'acct-member',
          memberKdfParams: acct.kdfParams, pinnedRevision: pin.revision, pinnedHash: pin.hash,
        });
        const sync = await member.syncNow(memberDoc);
        const memberProj = JSON.parse(await member.project(memberDoc));

        return {
          joinedDid: joined.didKey,
          sync,
          memberPeople: memberProj.people.map((p) => p.id),
          serverKeyringHead: (await transport.readKeyring(ownerDoc, 1)).head,
        };
      },

      // THE removeMember lifecycle through the real worker (chain): an owner shares a tree, a member joins and
      // sees the shared write, then the owner REMOVES the member — rotating the keyring (a forward-secret
      // re-epoch), re-unlocking the owner under the new epoch, and publishing the rotated revision. Proves live:
      // the rotation is published, the re-unlocked owner still writes a signed entry that syncs, and the removed
      // member is cryptographically locked out (a fresh join at the rotated head fails). Chain retains history,
      // so no self-heal cover is authored here (that path is dag-only, proven in Rust) — authorCover is a no-op.
      async shareRemoveLockout() {
        const transport = makeTransport();
        const treeId = new Uint8Array(16).fill(4);
        const ownerDoc = `rm-owner-${crypto.randomUUID()}`;
        const memberDoc = `rm-member-${crypto.randomUUID()}`;
        const rejoinDoc = `rm-rejoin-${crypto.randomUUID()}`;
        const ownerPass = 'owner passphrase here';
        const memberPass = 'member passphrase here';

        // Owner provisions the tree + mints the invite pin; member mints an account; owner admits them.
        const owner = spawnWorker();
        await owner.warm();
        await owner.clearPersisted(ownerDoc);
        await owner.provisionCore({ passphrase: ownerPass, treeId, memberId: 'acct-owner', docId: ownerDoc });
        await owner.attachTransport(ownerDoc, Comlink.proxy(transport));
        const pin = await owner.keyringHash(ownerDoc);

        const member = spawnWorker();
        await member.warm();
        await member.clearPersisted(memberDoc);
        const acct = await member.provisionMember(memberPass);
        await owner.addMember(ownerDoc, {
          passphrase: ownerPass, treeId, ownerMemberId: 'acct-owner', minRevision: 1,
          newMemberId: 'acct-member', role: 'editor',
          memberAuthorPublic: acct.authorPublicKey, memberHpkePublic: acct.hpkePublicKey,
        });

        // Owner writes a signed entry; the member joins via the genesis-walk and sees it.
        await owner.assertAnchor(ownerDoc, 'pShared', PERSON);
        await owner.commit(ownerDoc);
        await owner.syncNow(ownerDoc);
        await member.attachTransport(memberDoc, Comlink.proxy(transport));
        await member.joinAsMember({
          treeId, docId: memberDoc, passphrase: memberPass, memberId: 'acct-member',
          memberKdfParams: acct.kdfParams, pinnedRevision: pin.revision, pinnedHash: pin.hash,
        });
        await member.syncNow(memberDoc);
        const beforeRemoval = JSON.parse(await member.project(memberDoc)).people.map((p) => p.id);
        const headBefore = (await transport.readKeyring(ownerDoc, 1)).head; // rev 2 (genesis + add)

        // OWNER REMOVES the member: rotate the keyring, re-unlock the owner under the new epoch, publish rev 3.
        await owner.removeMember(ownerDoc, {
          passphrase: ownerPass, treeId, ownerMemberId: 'acct-owner', minRevision: 2, removeMemberId: 'acct-member',
        });
        const headAfter = (await transport.readKeyring(ownerDoc, 1)).head; // rev 3 (after the remove)

        // The re-unlocked owner still signs: write a POST-removal entry and push it.
        await owner.assertAnchor(ownerDoc, 'pAfter', PERSON);
        await owner.commit(ownerDoc);
        const push = await owner.syncNow(ownerDoc);
        const ownerAfter = JSON.parse(await owner.project(ownerDoc)).people.map((p) => p.id);

        // A REMOVED member is locked out: a fresh worker with the member's account can no longer join the
        // rotated tree (the walk is valid, but the member is absent from the head membership → unlock fails).
        const rejoin = spawnWorker();
        await rejoin.warm();
        await rejoin.clearPersisted(rejoinDoc);
        await rejoin.attachTransport(rejoinDoc, Comlink.proxy(transport));
        let lockedOut = false;
        try {
          await rejoin.joinAsMember({
            treeId, docId: rejoinDoc, passphrase: memberPass, memberId: 'acct-member',
            memberKdfParams: acct.kdfParams, pinnedRevision: pin.revision, pinnedHash: pin.hash,
          });
        } catch {
          lockedOut = true;
        }

        return { beforeRemoval, headBefore, headAfter, pushState: push.state, ownerAfter, lockedOut };
      },

      // THE dag distribution loop through the real worker: an owner provisions a DAG tree, admits a member,
      // and the member JOINS by verifying a self-contained anchor against an OOB pin (no per-revision walk) —
      // then verify-on-ingest accepts the owner's signed write AND the member's own maintainer write across
      // the pull. A wrong pin is refused. Finally a removeMember rotates + republishes the anchor and authors
      // the self-heal cover, pushing it to the data channel (the cover's covered-accept READER is proven in
      // Rust — SH-3; the browser proves the dag join/publish/sync/verify wiring + the live cover trigger).
      async shareVerifyDag() {
        const transport = makeTransport();
        const treeId = new Uint8Array(16).fill(6);
        const ownerDoc = `dag-owner-${crypto.randomUUID()}`;
        const memberDoc = `dag-member-${crypto.randomUUID()}`;
        const badDoc = `dag-bad-${crypto.randomUUID()}`;
        const ownerPass = 'owner passphrase here';
        const memberPass = 'member passphrase here';

        // Owner provisions a DAG tree, mints a member account, admits it as a Maintainer (so it can commit).
        const owner = spawnWorker();
        await owner.warm();
        await owner.clearPersisted(ownerDoc);
        await owner.provisionCore({ passphrase: ownerPass, treeId, memberId: 'acct-owner', docId: ownerDoc, engine: 'dag' });
        await owner.attachTransport(ownerDoc, Comlink.proxy(transport));

        const member = spawnWorker();
        await member.warm();
        await member.clearPersisted(memberDoc);
        const acct = await member.provisionMember(memberPass);
        await owner.addMember(ownerDoc, {
          passphrase: ownerPass, treeId, ownerMemberId: 'acct-owner',
          newMemberId: 'acct-member', role: 'maintainer',
          memberAuthorPublic: acct.authorPublicKey, memberHpkePublic: acct.hpkePublicKey, engine: 'dag',
        });
        const pin = await owner.dagAnchorPin(ownerDoc); // the OOB trust pin (post-add anchor)

        // Owner writes a signed entry and pushes it.
        await owner.assertAnchor(ownerDoc, 'pShared', PERSON);
        await owner.commit(ownerDoc);
        await owner.syncNow(ownerDoc);

        // A WRONG pin is refused (the trust gate): flip a byte of the pin → the join must throw.
        const badPin = new Uint8Array(pin); badPin[0] ^= 0xff;
        const bad = spawnWorker();
        await bad.warm();
        await bad.clearPersisted(badDoc);
        await bad.attachTransport(badDoc, Comlink.proxy(transport));
        let wrongPinRejected = false;
        try {
          await bad.joinAsMember({
            engine: 'dag', treeId, docId: badDoc, passphrase: memberPass, memberId: 'acct-member',
            memberKdfParams: acct.kdfParams, pin: badPin,
          });
        } catch { wrongPinRejected = true; }

        // The member JOINS with the right pin, syncs, and sees the owner's signed write.
        await member.attachTransport(memberDoc, Comlink.proxy(transport));
        const joined = await member.joinAsMember({
          engine: 'dag', treeId, docId: memberDoc, passphrase: memberPass, memberId: 'acct-member',
          memberKdfParams: acct.kdfParams, pin,
        });
        await member.syncNow(memberDoc);
        const memberSees = JSON.parse(await member.project(memberDoc)).people.map((p) => p.id);

        // The member writes its OWN maintainer entry; the owner pulls it and verify-on-ingest accepts it.
        await member.assertAnchor(memberDoc, 'pMember', PERSON);
        await member.commit(memberDoc);
        await member.syncNow(memberDoc);
        await owner.syncNow(ownerDoc);
        const ownerSees = JSON.parse(await owner.project(ownerDoc)).people.map((p) => p.id);

        // Owner REMOVES the member: rotate + republish the anchor, and author + push the self-heal cover over
        // the member's now-removed history. The data channel grows by exactly the cover.
        const keyringHeadBefore = (await transport.readKeyring(ownerDoc, 1)).head;
        const dataBefore = transport._size();
        await owner.removeMember(ownerDoc, {
          passphrase: ownerPass, treeId, ownerMemberId: 'acct-owner', removeMemberId: 'acct-member', engine: 'dag',
        });
        const keyringHeadAfter = (await transport.readKeyring(ownerDoc, 1)).head;
        const dataAfter = transport._size();

        return {
          joinedDid: joined.didKey,
          memberSees,
          ownerSees,
          wrongPinRejected,
          keyringGrew: keyringHeadAfter > keyringHeadBefore,
          coverPushed: dataAfter - dataBefore,
        };
      },

      // reset() clears the tree + durable store, so a demo reseed replaces rather than piles up.
      async reseedClears() {
        const doc = 'reseed-e2e';
        const w = spawnWorker();
        await w.warm();
        await w.clearPersisted(doc);
        await w.openDev(new Uint8Array(16).fill(5), new Uint8Array(8).fill(0xc3), DID, doc, true);
        await w.assertAnchor(doc, 'pOld', PERSON);
        await w.commit(doc);
        const before = JSON.parse(await w.project(doc));
        await w.resetCore(doc);
        const cleared = JSON.parse(await w.project(doc));
        await w.assertAnchor(doc, 'pNew', PERSON);
        await w.commit(doc);
        const after = JSON.parse(await w.project(doc));
        return {
          beforeIds: before.people.map((p) => p.id),
          clearedIds: cleared.people.map((p) => p.id),
          afterIds: after.people.map((p) => p.id),
        };
      },
    };

    document.getElementById('status').textContent = 'ready';
    window.__ready = true;
  </script>
</body>
