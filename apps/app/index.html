<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>openom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/app.css" />
    <link rel="icon" href="./brand/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./brand/icon.svg">

  <!-- Shared links show the running app, not the repo: own image, own text.
       %SITE_URL% is substituted at deploy time (scripts/site-url.mjs) — crawlers
       discard relative paths, so og:image and og:url must be absolute. -->
  <meta name="description" content="A privacy-first family tree for desktop, mobile and the browser. No account needed, your records stay on your device, sync is optional and encrypted.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="openom">
  <meta property="og:url" content="%SITE_URL%">
  <meta property="og:title" content="openom — family trees that stay yours">
  <meta property="og:description" content="Works without an account. Sync when you want it — encrypted on your device, so the server never sees a name.">
  <meta property="og:image" content="%SITE_URL%brand/social-web.png">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="640">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="openom — family trees that stay yours">
  <meta name="twitter:description" content="Works without an account. Sync when you want it — encrypted on your device, so the server never sees a name.">
  <meta name="twitter:image" content="%SITE_URL%brand/social-web.png">
</head>
  <body>
    <div id="app" data-view="tree"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
