[package]
name = "openom-tauri"
version = "0.1.0"
description = "openom — desktop and mobile shell"
authors = ["openom"]
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "openom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# The NATIVE app-core host (OPE-427 Full-A): the DEK + claim engine + local device store run natively; the
# Tauri #[command]s below are thin wrappers over it. `sqlite` turns on the durable keyring/watermark store.
openom-app-core-host = { path = "../../packages/openom-app-core-host", features = ["sqlite"] }
# The durable keyring/watermark custody store the host is parameterized over.
openom-vault-host = { path = "../../packages/openom-vault-host", features = ["sqlite"] }
# The keyring engine tag (chosen at runtime for NEW trees) + the passphrase newtype the lifecycle takes.
openom-keyring-api = { path = "../../packages/openom-keyring-api" }
openom-crypto = { path = "../../packages/openom-crypto" }
tauri = { version = "2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The native media blob store (OPE-435): a durable content-addressed SQLite table for photos/attachments.
store-media = { path = "../../packages/store-media" }

[features]
# Von tauri-cli beim Erzeugen des Release-Builds gesetzt.
custom-protocol = ["tauri/custom-protocol"]
