<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>openom — Handy, hoch und quer</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; padding: 28px; display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap;
    background: oklch(94% 0.006 166.4); font: 13px/1.4 ui-sans-serif, system-ui, sans-serif;
    color: oklch(45% 0.01 166.4);
  }
  figure { margin: 0; display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .device { border-radius: 34px; padding: 10px; background: #1c1c1e; box-shadow: 0 18px 44px rgba(0,0,0,.22); }
  iframe { border: 0; display: block; border-radius: 26px; background: #fff; }
  figcaption { font-variant-numeric: tabular-nums; letter-spacing: .02em; }
</style>
</head>
<body>
  <figure>
    <div class="device"><iframe src="../app/index.html" width="360" height="800" title="Android, hoch"></iframe></div>
    <figcaption>360 × 800 — hoch, schmal</figcaption>
  </figure>
  <figure>
    <div class="device"><iframe src="../app/index.html" width="390" height="844" title="iPhone 14, hoch"></iframe></div>
    <figcaption>390 × 844 — hoch</figcaption>
  </figure>
  <figure>
    <div class="device"><iframe src="../app/index.html" width="740" height="360" title="Handy, quer, schmal"></iframe></div>
    <figcaption>740 × 360 — quer, schmal</figcaption>
  </figure>
</body>
</html>
