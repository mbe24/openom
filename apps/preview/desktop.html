<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>openom — Desktop und Handy quer</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; padding: 26px; display: flex; gap: 30px; align-items: flex-start;
    flex-wrap: nowrap; overflow-x: auto; min-height: 100vh; box-sizing: border-box;
    background: oklch(94% 0.006 166.4); font: 13px/1.4 ui-sans-serif, system-ui, sans-serif;
    color: oklch(45% 0.01 166.4);
  }
  figure { margin: 0; display: flex; flex-direction: column; gap: 10px; align-items: center; flex: none; }
  .window { border-radius: 14px; overflow: hidden; background: #e9e9ec; box-shadow: 0 18px 44px rgba(0,0,0,.22); }
  .chrome { height: 30px; display: flex; align-items: center; gap: 7px; padding: 0 12px; background: #dcdce0; }
  .chrome i { width: 11px; height: 11px; border-radius: 50%; background: #bfbfc6; }
  .device { border-radius: 34px; padding: 10px; background: #1c1c1e; box-shadow: 0 18px 44px rgba(0,0,0,.22); }
  iframe { border: 0; display: block; background: #fff; }
  .device iframe { border-radius: 26px; }
  figcaption { font-variant-numeric: tabular-nums; letter-spacing: .02em; }
</style>
</head>
<body>
  <figure>
    <div class="window">
      <div class="chrome"><i></i><i></i><i></i></div>
      <iframe src="../app/index.html" width="1440" height="900" title="Desktop und Webapp"></iframe>
    </div>
    <figcaption>1440 × 900 — Desktop und Webapp</figcaption>
  </figure>
  <figure>
    <div class="device"><iframe src="../app/index.html" width="740" height="360" title="Handy, quer"></iframe></div>
    <figcaption>740 × 360 — Handy, quer</figcaption>
  </figure>
</body>
</html>
