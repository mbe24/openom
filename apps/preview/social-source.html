<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>openom — social previews (render source)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  body { margin: 0; background: #d9dedb; display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 24px; font-family: Inter, system-ui, sans-serif; }

  .lockup { display: flex; align-items: center; gap: 30px; }

  .tile span { font-family: Newsreader, Georgia, serif; font-size: 42px; font-weight: 500; letter-spacing: -.02em; }
  .word { font-family: Newsreader, Georgia, serif; font-size: 84px; font-weight: 500; letter-spacing: -.03em; display: flex; line-height: 1; }
</style>
</head>
<body>

  <div class="lockup" style="position:relative;margin-bottom:28px">
    <div class="tile" style="background:#4a6b5d"><span style="color:#fff">om</span></div>
    <div class="word"><span style="color:#1c1c1e">open</span><span style="color:#4a6b5d">om</span></div>
  </div>
  <div style="position:relative;font-family:Newsreader,Georgia,serif;font-size:34px;color:#1c1c1e;margin-bottom:14px">Family trees that stay yours.</div>
  <div style="position:relative;font-size:22px;color:#6e6e73;line-height:1.5">Privacy-first, open source, many languages.<br>Desktop, Android, iOS and the browser — one app.</div>
</div>
